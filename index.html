<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FromSoft">
<title>FromSoft Checklist</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;background:#0a0a08;color:#c9b99a;min-height:100vh}
#header{position:sticky;top:0;z-index:20;padding:14px 16px 0;border-bottom:1px solid #c0883a44;background:#0a0a08;transition:background .4s,border-color .4s}
#title-sub{text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:4px}
#title-main{text-align:center;font-size:clamp(16px,4vw,26px);letter-spacing:.1em;color:#eeddb8;font-weight:normal;margin-bottom:10px}
#tabs{display:flex;overflow-x:auto;gap:2px;scrollbar-width:none;-ms-overflow-style:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px 10px;background:transparent;border:none;border-bottom:2px solid transparent;font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;cursor:pointer;color:#6a5a4a;font-family:Georgia,serif;transition:all .15s}
.tab-pct{font-size:9px;margin-top:1px;display:block}
#body{padding:10px 16px 0;max-width:720px;margin:0 auto}
#pt-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative}
#pt-btn{flex:1;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#171410;border-radius:4px;border:1px solid #c0883a55;color:#c0883a;font-size:12px;letter-spacing:.06em;cursor:pointer;text-align:left;font-family:Georgia,serif}
.icon-btn{padding:7px 10px;background:#171410;border:1px solid #2e2418;border-radius:4px;color:#6a5a4a;font-size:13px;cursor:pointer;font-family:Georgia,serif}
#dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1a1612;border:1px solid #c0883a44;border-radius:4px;z-index:50;overflow:hidden;box-shadow:0 8px 24px #00000088;display:none}
#dd.open{display:block}
.dd-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #2a2218}
.dd-name{flex:1;background:none;border:none;text-align:left;cursor:pointer;color:#a09070;font-size:12px;font-family:Georgia,serif}
.dd-pct{font-size:10px;color:#5a4a38;margin-left:8px}
.dd-act{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 4px;font-family:Georgia,serif;color:#4a3a28}
.dd-del{color:#4a2a2a;font-size:13px}
#dd-new{width:100%;padding:9px 12px;background:none;border:none;color:#5a4a38;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:left;font-family:Georgia,serif}
#rename-bar{display:none;gap:6px;margin-bottom:10px}
#rename-bar.open{display:flex}
#rename-inp{flex:1;padding:6px 10px;background:#171410;border:1px solid #c0883a88;border-radius:4px;color:#e0cc99;font-size:12px;outline:none;font-family:Georgia,serif}
#rename-save{padding:6px 14px;border-radius:4px;border:1px solid #c0883a66;background:#c0883a33;color:#c0883a;font-size:11px;cursor:pointer;font-family:Georgia,serif}
#rename-cancel{padding:6px 10px;background:transparent;border:1px solid #2a2218;border-radius:4px;color:#5a4a38;font-size:11px;cursor:pointer;font-family:Georgia,serif}
#prog-row{display:flex;justify-content:space-between;font-size:11px;color:#6a5a4a;margin-bottom:5px}
#prog-bg{height:3px;background:#1a1612;border-radius:2px;margin-bottom:12px}
#prog-fill{height:100%;border-radius:2px;transition:width .5s ease,background .4s;width:0}
#filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{padding:4px 12px;border-radius:20px;border:1px solid #2a2218;background:transparent;color:#5a4a38;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:Georgia,serif}
#reset-btn{margin-left:auto;padding:4px 12px;border-radius:20px;border:1px solid #2a1818;background:transparent;color:#4a2a2a;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:Georgia,serif}
#sections{padding:0 0 80px}
.sw{margin-bottom:10px;transition:opacity .3s}
.sw.locked{opacity:.4}
.sh{width:100%;display:flex;align-items:center;gap:10px;background:#171410;border:1px solid #2e2418;border-radius:4px 4px 0 0;padding:11px 14px;cursor:pointer;text-align:left;font-family:Georgia,serif}
.sh.coll{border-radius:4px;background:#13110e}
.sh.lk{cursor:not-allowed}
.badge{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0}
.stitle{flex:1;font-size:13px;letter-spacing:.06em;color:#ddc99a;text-transform:uppercase}
.stitle.lk{color:#5a4a38}
.scnt{font-size:10px;color:#5a4a38;font-family:monospace}
.lkmsg{font-size:10px;color:#4a3a28}
.sitems{border:1px solid #2e2418;border-top:none;border-radius:0 0 4px 4px}
.irow{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;cursor:pointer;border-top:1px solid #1a1612;transition:background .1s;background:transparent}
.irow:first-child{border-top:none}
.irow.done{background:#100e0b}
.irow:not(.done):hover{background:#1a1612}
.icb{width:15px;height:15px;min-width:15px;border:1px solid #3a2e20;border-radius:2px;display:flex;align-items:center;justify-content:center;margin-top:2px;flex-shrink:0;transition:all .15s}
.itxt{font-size:13px;line-height:1.5;color:#b09a7a}
.itxt.done{color:#3a3028;text-decoration:line-through;text-decoration-color:#3a3028}
</style>
</head>
<body>
<div id="header">
  <div id="title-sub">FROM SOFTWARE · COMPLETE PLAYTHROUGH GUIDE</div>
  <div id="title-main">DARK SOULS I</div>
  <div id="tabs"></div>
</div>
<div id="body">
  <div id="pt-row">
    <button id="pt-btn" onclick="toggleDD(event)">
      <span id="pt-name">▶ Playthrough 1</span>
      <span id="pt-arr">▾</span>
    </button>
    <button class="icon-btn" onclick="startRename()">✎</button>
    <button class="icon-btn" onclick="createPt()">+</button>
    <div id="dd"></div>
  </div>
  <div id="rename-bar">
    <input id="rename-inp" type="text" onkeydown="if(event.key==='Enter')commitRename();if(event.key==='Escape')cancelRename();">
    <button id="rename-save" onclick="commitRename()">Save</button>
    <button id="rename-cancel" onclick="cancelRename()">Cancel</button>
  </div>
  <div id="prog-row"><span id="prog-txt">0 / 0</span><span id="prog-pct">0%</span></div>
  <div id="prog-bg"><div id="prog-fill"></div></div>
  <div id="filter-row">
    <button class="fbtn" data-f="all" onclick="setFilter('all')">All</button>
    <button class="fbtn" data-f="main" onclick="setFilter('main')">Main</button>
    <button class="fbtn" data-f="optional" onclick="setFilter('optional')">Optional</button>
    <button class="fbtn" data-f="missable" onclick="setFilter('missable')">Missable</button>
    <button id="reset-btn" onclick="resetPt()">Reset</button>
  </div>
  <div id="sections"></div>
</div>
<script>
const GAMES=[{id:"ds1",label:"Dark Souls I",shortLabel:"DS1",accent:"#c0883a",bg:"#0a0a08",sections:[{id:"ds1_undead_asylum",title:"Undead Asylum",type:"main",items:[{id:"ds1_001",text:"Escape your cell, pick up Dungeon Cell Key"},{id:"ds1_002",text:"Defeat Asylum Demon (first encounter — run past or fight)"},{id:"ds1_003",text:"Find the Estus Flask on Oscar's corpse"},{id:"ds1_004",text:"Obtain the Straight Sword Hilt from Oscar"},{id:"ds1_005",text:"Defeat Asylum Demon (boss fight with weapon)"},{id:"ds1_006",text:"Receive the Undead Asylum F2 East Key and Big Pilgrim's Key"}]},{id:"ds1_firelink",title:"Firelink Shrine",type:"main",requires:["ds1_undead_asylum"],items:[{id:"ds1_007",text:"Arrive at Firelink Shrine, light the bonfire"},{id:"ds1_008",text:"Talk to Crestfallen Warrior"},{id:"ds1_009",text:"Talk to Anastacia of Astora (Fire Keeper)"},{id:"ds1_010",text:"Find the elevator shortcut to Undead Burg"}]},{id:"ds1_undead_burg",title:"Undead Burg & Parish",type:"main",requires:["ds1_firelink"],items:[{id:"ds1_011",text:"Light Undead Burg bonfire"},{id:"ds1_012",text:"Defeat Taurus Demon"},{id:"ds1_013",text:"Cross the Hellkite Drake bridge (run or lure)"},{id:"ds1_014",text:"Light Undead Parish bonfire"},{id:"ds1_015",text:"Speak to Solaire of Astora (summon available from here)"},{id:"ds1_016",text:"Defeat Bell Gargoyles, ring the first Bell of Awakening"},{id:"ds1_017",text:"Free Lautrec from his cell (optional — leads to questline)"}]},{id:"ds1_darkroot",title:"Darkroot Garden & Basin",type:"optional",requires:["ds1_undead_burg"],items:[{id:"ds1_018",text:"Light Darkroot Garden bonfire"},{id:"ds1_019",text:"Defeat Moonlight Butterfly (optional)"},{id:"ds1_020",text:"Obtain the Crest of Artorias (unlock sealed door)"},{id:"ds1_021",text:"Defeat Hydra in Darkroot Basin (optional)"},{id:"ds1_022",text:"Free Dusk of Oolacile from golden crystal golem (optional)"},{id:"ds1_023",text:"Fight Forest Hunters (optional — join covenant or fight)"}]},{id:"ds1_lower_undead",title:"Lower Undead Burg & Depths",type:"main",requires:["ds1_undead_burg"],items:[{id:"ds1_024",text:"Unlock the door to Lower Undead Burg (Residence Key)"},{id:"ds1_025",text:"Defeat Capra Demon"},{id:"ds1_026",text:"Light Depths bonfire"},{id:"ds1_027",text:"Rescue Griggs of Vinheim (optional)"},{id:"ds1_028",text:"Defeat Gaping Dragon"},{id:"ds1_029",text:"Free Laurentius of the Great Swamp (pyromancer NPC)"}]},{id:"ds1_blighttown",title:"Blighttown & Quelaag's Domain",type:"main",requires:["ds1_lower_undead"],items:[{id:"ds1_030",text:"Navigate Blighttown (poison swamp)"},{id:"ds1_031",text:"Light Great Hollow / Ash Lake bonfires (optional detour)"},{id:"ds1_032",text:"Defeat Chaos Witch Quelaag"},{id:"ds1_033",text:"Ring the second Bell of Awakening"},{id:"ds1_034",text:"Speak to the Fair Lady in Quelaag's Domain (optional covenant)"}]},{id:"ds1_anor_londo",title:"Sen's Fortress & Anor Londo",type:"main",requires:["ds1_blighttown"],items:[{id:"ds1_035",text:"Enter Sen's Fortress (gate opens after both bells)"},{id:"ds1_036",text:"Defeat the Iron Golem"},{id:"ds1_037",text:"Arrive at Anor Londo"},{id:"ds1_038",text:"Light Anor Londo bonfire"},{id:"ds1_039",text:"Speak to Siegmeyer of Catarina (optional questline)"},{id:"ds1_040",text:"Defeat Dragon Slayer Ornstein & Executioner Smough"},{id:"ds1_041",text:"Receive the Lordvessel from Gwynevere"},{id:"ds1_042",text:"Place the Lordvessel at Firelink Altar"}]},{id:"ds1_lordvessel_areas",title:"Lord Soul Areas (any order)",type:"main",requires:["ds1_anor_londo"],items:[{id:"ds1_043",text:"Defeat Sif the Great Grey Wolf (Darkroot Garden)"},{id:"ds1_044",text:"Enter the Catacombs, defeat Pinwheel, get Rite of Kindling"},{id:"ds1_045",text:"Defeat Gravelord Nito (Tomb of the Giants)"},{id:"ds1_046",text:"Enter New Londo Ruins, drain the water"},{id:"ds1_047",text:"Defeat the Four Kings (New Londo)"},{id:"ds1_048",text:"Enter the Duke's Archives, defeat Seath the Scaleless"},{id:"ds1_049",text:"Enter Lost Izalith, defeat Bed of Chaos"}]},{id:"ds1_dlc",title:"Artorias of the Abyss (DLC)",type:"optional",requires:["ds1_darkroot"],items:[{id:"ds1_050",text:"Find the DLC entrance in Darkroot Basin"},{id:"ds1_051",text:"Travel back in time to Oolacile"},{id:"ds1_052",text:"Defeat Sanctuary Guardian"},{id:"ds1_053",text:"Defeat Artorias the Abysswalker"},{id:"ds1_054",text:"Defeat Manus, Father of the Abyss"},{id:"ds1_055",text:"Defeat Black Dragon Kalameet (optional, cut tail for weapon)"}]},{id:"ds1_endgame",title:"Kiln of the First Flame",type:"main",requires:["ds1_lordvessel_areas"],items:[{id:"ds1_056",text:"Enter the Kiln of the First Flame"},{id:"ds1_057",text:"Defeat Gwyn, Lord of Cinder"},{id:"ds1_058",text:"Choose ending: Link the Fire OR Walk Away (Dark Lord)"}]},{id:"ds1_questlines",title:"Key Questlines & Missables",type:"missable",items:[{id:"ds1_059",text:"Solaire questline — keep him alive, find him in Lost Izalith (avoid Chaos Bugs)"},{id:"ds1_060",text:"Siegmeyer of Catarina — help him 3 times, finish in Ash Lake"},{id:"ds1_061",text:"Lautrec questline — free him, prevent him from killing Fire Keeper (or let it happen)"},{id:"ds1_062",text:"Sorcerer Griggs + Logan questlines"},{id:"ds1_063",text:"Dusk of Oolacile — free her, buy spells before DLC"},{id:"ds1_064",text:"Join Covenant of Artorias (kill Sif while in Darkwraith covenant)"},{id:"ds1_065",text:"Collect all Pyromancy spells from Laurentius and Quelana"},{id:"ds1_066",text:"Cut all boss tails for unique weapons (Seath, Gaping Dragon, Kalameet...)"}]}]},{id:"ds2",label:"Dark Souls II",shortLabel:"DS2",accent:"#7a9fbd",bg:"#08090d",sections:[{id:"ds2_things_betwixt",title:"Things Betwixt & Majula",type:"main",items:[{id:"ds2_001",text:"Complete Things Betwixt intro area"},{id:"ds2_002",text:"Arrive at Majula, light the bonfire"},{id:"ds2_003",text:"Talk to the Emerald Herald (Estus + leveling)"},{id:"ds2_004",text:"Explore Majula: find the mansion, well, pit"},{id:"ds2_005",text:"Rescue Cale the Cartographer (optional — unlocks world map)"}]},{id:"ds2_forest",title:"Forest of Fallen Giants",type:"main",requires:["ds2_things_betwixt"],items:[{id:"ds2_006",text:"Light the Cardinal Tower bonfire"},{id:"ds2_007",text:"Defeat The Last Giant"},{id:"ds2_008",text:"Defeat The Pursuer (optional on first encounter; mandatory later)"},{id:"ds2_009",text:"Find the Soldier Key, open shortcut back to Majula"},{id:"ds2_010",text:"Rescue Pate (optional questline starts here)"}]},{id:"ds2_heide",title:"Heide's Tower of Flame",type:"main",requires:["ds2_forest"],items:[{id:"ds2_011",text:"Light Heide's Tower of Flame bonfire"},{id:"ds2_012",text:"Defeat Dragonrider"},{id:"ds2_013",text:"Defeat Old Dragonslayer (optional)"},{id:"ds2_014",text:"Enter No-man's Wharf"},{id:"ds2_015",text:"Defeat Flexile Sentry"},{id:"ds2_016",text:"Light the ship, travel to Lost Bastille"}]},{id:"ds2_bastille",title:"Lost Bastille & Sinner's Rise",type:"main",requires:["ds2_heide"],items:[{id:"ds2_017",text:"Light Lost Bastille bonfire"},{id:"ds2_018",text:"Defeat Belfry Gargoyles (Belfry Luna — optional)"},{id:"ds2_019",text:"Defeat Ruin Sentinels"},{id:"ds2_020",text:"Reach Sinner's Rise"},{id:"ds2_021",text:"Defeat Lost Sinner"}]},{id:"ds2_huntsmans",title:"Huntsman's Copse & Harvest Valley",type:"main",requires:["ds2_things_betwixt"],items:[{id:"ds2_022",text:"Light Huntsman's Copse bonfire"},{id:"ds2_023",text:"Defeat Skeleton Lords"},{id:"ds2_024",text:"Enter Harvest Valley"},{id:"ds2_025",text:"Defeat Covetous Demon"},{id:"ds2_026",text:"Enter Earthen Peak"},{id:"ds2_027",text:"Defeat Mytha, the Baneful Queen"}]},{id:"ds2_iron_keep",title:"Iron Keep",type:"main",requires:["ds2_huntsmans"],items:[{id:"ds2_028",text:"Light Iron Keep bonfire"},{id:"ds2_029",text:"Defeat Smelter Demon"},{id:"ds2_030",text:"Defeat Old Iron King"},{id:"ds2_031",text:"Optional: Defeat Blue Smelter Demon (Iron Passage)"}]},{id:"ds2_shaded_woods",title:"Shaded Woods & Drangleic Castle",type:"main",requires:["ds2_forest"],items:[{id:"ds2_032",text:"Unlock Shaded Woods (Fragrant Branch of Yore)"},{id:"ds2_033",text:"Light Ruined Fork Road bonfire"},{id:"ds2_034",text:"Defeat Scorpioness Najka"},{id:"ds2_035",text:"Enter Doors of Pharros, defeat Royal Rat Authority"},{id:"ds2_036",text:"Defeat Duke's Dear Freja (Brightstone Cove Tseldora)"},{id:"ds2_037",text:"Enter Drangleic Castle (4 souls required to open gate)"},{id:"ds2_038",text:"Defeat Twin Dragonriders"},{id:"ds2_039",text:"Defeat Looking Glass Knight"}]},{id:"ds2_shrine_amana",title:"Shrine of Amana & Undead Crypt",type:"main",requires:["ds2_shaded_woods"],items:[{id:"ds2_040",text:"Navigate Shrine of Amana (ranged enemies — very annoying)"},{id:"ds2_041",text:"Defeat Demon of Song"},{id:"ds2_042",text:"Light Undead Ditch bonfire"},{id:"ds2_043",text:"Defeat Velstadt, the Royal Aegis"},{id:"ds2_044",text:"Free King Vendrick (optional — needed for true ending)"},{id:"ds2_045",text:"Enter Throne of Want"}]},{id:"ds2_memories",title:"Giant Memories (optional but story-relevant)",type:"optional",requires:["ds2_shaded_woods"],items:[{id:"ds2_046",text:"Obtain the Ashen Mist Heart from Ancient Dragon"},{id:"ds2_047",text:"Enter Memory of Jeigh — defeat Giant Lord"},{id:"ds2_048",text:"Enter Memory of Orro"},{id:"ds2_049",text:"Enter Memory of Vammar"},{id:"ds2_050",text:"Defeat King Vendrick in the Undead Crypt (optional but recommended)"}]},{id:"ds2_dlcs",title:"DLC: Crown of the Sunken King",type:"optional",items:[{id:"ds2_051",text:"Enter Shulva, Sanctum City"},{id:"ds2_052",text:"Navigate the poison/elevator puzzle area"},{id:"ds2_053",text:"Defeat Elana, the Squalid Queen"},{id:"ds2_054",text:"Defeat Sinh, the Slumbering Dragon"},{id:"ds2_055",text:"Collect Crown of the Sunken King"}]},{id:"ds2_dlc2",title:"DLC: Crown of the Old Iron King",type:"optional",items:[{id:"ds2_056",text:"Enter Brume Tower"},{id:"ds2_057",text:"Defeat Fume Knight (one of the hardest bosses in the game)"},{id:"ds2_058",text:"Defeat Sir Alonne"},{id:"ds2_059",text:"Collect Crown of the Old Iron King"}]},{id:"ds2_dlc3",title:"DLC: Crown of the Ivory King",type:"optional",items:[{id:"ds2_060",text:"Enter Frozen Eleum Loyce"},{id:"ds2_061",text:"Free the 3 Loyce Knights (needed for final boss)"},{id:"ds2_062",text:"Defeat Aava, the King's Pet"},{id:"ds2_063",text:"Defeat Burnt Ivory King"},{id:"ds2_064",text:"Collect Crown of the Ivory King"}]},{id:"ds2_endgame",title:"Throne of Want — Endgame",type:"main",requires:["ds2_shrine_amana"],items:[{id:"ds2_065",text:"Defeat Throne Watcher & Defender"},{id:"ds2_066",text:"Defeat Nashandra"},{id:"ds2_067",text:"(True Ending) Defeat Aldia, Scholar of the First Sin (needs all 3 DLC crowns + Vendrick)"},{id:"ds2_068",text:"Choose ending: Link the Flame OR Refuse"}]},{id:"ds2_questlines",title:"Key Questlines & Missables",type:"missable",items:[{id:"ds2_069",text:"Pate & Creighton rivalry — follow both questlines through Brightstone Cove"},{id:"ds2_070",text:"Lucatiel of Mirrah — summon her in 3 fights, talk to her between each"},{id:"ds2_071",text:"Benhart of Jugo — summon him across multiple fights"},{id:"ds2_072",text:"Collect all Estus Flask Shards (12 max) and Sublime Bone Dust (5)"},{id:"ds2_073",text:"Join Company of Champions or Way of Blue (affects world state)"},{id:"ds2_074",text:"Rescue Rosabeth of Melfia (Fragrant Branch of Yore needed)"}]}]},{id:"ds3",label:"Dark Souls III",shortLabel:"DS3",accent:"#a07850",bg:"#09080a",sections:[{id:"ds3_cemetery",title:"Cemetery of Ash & Firelink Shrine",type:"main",items:[{id:"ds3_001",text:"Defeat Iudex Gundyr (tutorial boss)"},{id:"ds3_002",text:"Arrive at Firelink Shrine"},{id:"ds3_003",text:"Talk to the Fire Keeper"},{id:"ds3_004",text:"Talk to Hawkwood (gives Ashen Estus Flask)"},{id:"ds3_005",text:"Buy the Tower Key (optional — access rooftop, crow, etc.)"}]},{id:"ds3_high_wall",title:"High Wall of Lothric",type:"main",requires:["ds3_cemetery"],items:[{id:"ds3_006",text:"Light High Wall of Lothric bonfire"},{id:"ds3_007",te ems:[{id:"er_053",text:"Ending 1 — Elden Lord: Mend the Elden Ring (default)"},{id:"er_054",text:"Ending 2 — Ranni's Age of Stars: Complete Ranni's questline, give ring after Radagon"},{id:"er_055",text:"Ending 3 — Lord of Frenzied Flame: Find Three Fingers under Leyndell, burn everything"},{id:"er_056",text:"Ending variants: Goldmask's Law, Dung Eater's Curse, Fia's Age of the Duskborn"}]},{id:"er_optional_areas",title:"Major Optional Areas",type:"optional",items:[{id:"er_057",text:"Siofra River & Mohgwyn Palace (Varré questline or secret teleporter)"},{id:"er_058",text:"Defeat Mohg, Lord of Blood"},{id:"er_059",text:"Nokstella, Eternal City (Ranni's questline)"},{id:"er_060",text:"Deeproot Depths & Fia's questline (Lichdragon Fortissax)"},{id:"er_061",text:"Defeat Dragonlord Placidusax (Farum Azula hidden boss — lie down at the wind area)"}]},{id:"er_dlc",title:"DLC: Shadow of the Erdtree",type:"optional",requires:["er_ashen_leyndell"],items:[{id:"er_062",text:"Defeat Mohg, Lord of Blood AND find Leda in the Realm of Shadow"},{id:"er_063",text:"Enter the Shadow Realm via Mohg's arena"},{id:"er_064",text:"Explore the Shadow of the Erdtree map (collect Scadutree Fragments to scale up)"},{id:"er_065",text:"Defeat Rellana, Twin Moon Knight"},{id:"er_066",text:"Defeat Messmer the Impaler"},{id:"er_067",text:"Defeat Midra, Lord of Frenzied Flame (optional)"},{id:"er_068",text:"Defeat Bayle the Dread (optional dragon boss)"},{id:"er_069",text:"Defeat Romina, Saint of the Bud"},{id:"er_070",text:"Defeat Metyr, Mother of Fingers (optional)"},{id:"er_071",text:"Defeat Scadutree Avatar (optional)"},{id:"er_072",text:"Defeat Promised Consort Radahn (final DLC boss)"}]},{id:"er_questlines",title:"Key Questlines & Missables",type:"missable",items:[{id:"er_073",text:"Ranni — complete her full questline for Age of Stars ending"},{id:"er_074",text:"Fia — give her the Cursemark of Death, defeat Lichdragon Fortissax, Duskborn ending"},{id:"er_075",text:"Goldmask & Brother Corhyn — follow them to Leyndell rooftop, solve the riddle"},{id:"er_076",text:"Dung Eater — collect Seedbed Curses, give him the Loathsome Dung Eater puppet"},{id:"er_077",text:"White-Faced Varré — invade 3 times, get Pureblood Knight's Medal for Mohgwyn"},{id:"er_078",text:"Millicent — Malenia's daughter questline, ends at Haligtree"},{id:"er_079",text:"Nepheli Loux — give her the Ancient Dragon Smithing Stone in Volcano Manor area"},{id:"er_080",text:"Collect all Map Fragments, all Crystal Tears, all Spirit Ashes upgrades"}]}]}];
const TS={main:{label:"Main",color:"#c9a96e"},optional:{label:"Optional",color:"#6ea0c9"},missable:{label:"Missable",color:"#c96e6e"}};
const SK="fromsoft-html-v1";
let ST=load(),AG="ds1",AF="all",CO={},DD=false,RI=null;
function load(){try{const r=JSON.parse(localStorage.getItem(SK)||"null");if(r&&r.playthroughs)return r;}catch{}const p={},a={};GAMES.forEach(g=>{const id=g.id+"_pt1";p[id]={id,gameId:g.id,name:"Playthrough 1",createdAt:Date.now(),checked:{}};a[g.id]=id;});return{playthroughs:p,activePerGame:a};}
function save(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch{}}
function uid(){return Math.random().toString(36).slice(2,9);}
function G(){return GAMES.find(g=>g.id===AG);}
function PID(){return ST.activePerGame[AG];}
function PT(){return ST.playthroughs[PID()];}
function CH(){return PT()?.checked||{};}
function PTS(){return Object.values(ST.playthroughs).filter(p=>p.gameId===AG).sort((a,b)=>a.createdAt-b.createdAt);}
function unlocked(sec){if(!sec.requires||!sec.requires.length)return true;const g=G();return sec.requires.every(rid=>{const r=g.sections.find(s=>s.id===rid);if(!r)return true;return r.items.filter(i=>CH()[i.id]).length>=Math.ceil(r.items.length*0.5);});}
function toggleItem(id){const pt=PT();pt.checked[id]=!pt.checked[id];save();render();}
function switchGame(id){AG=id;DD=false;RI=null;render();}
function toggleDD(e){e.stopPropagation();DD=!DD;renderDD();}
function switchPt(id){ST.activePerGame[AG]=id;save();DD=false;RI=null;render();}
function createPt(){const n=PTS().length+1,id=AG+"_"+uid();ST.playthroughs[id]={id,gameId:AG,name:"Playthrough "+n,createdAt:Date.now(),checked:{}};ST.activePerGame[AG]=id;save();DD=false;render();}
function deletePt(id){if(PTS().length<=1)return;if(!confirm("Delete \""+ST.playthroughs[id]?.name+"\"?"))return;delete ST.playthroughs[id];const r=Object.values(ST.playthroughs).filter(p=>p.gameId===AG);ST.activePerGame[AG]=r[0]?.id||"";save();DD=false;render();}
function startRename(){RI=PID();const b=document.getElementById("rename-bar");b.classList.add("open");const i=document.getElementById("rename-inp");i.value=PT()?.name||"";i.focus();DD=false;renderDD();}
function startRenamePt(id){RI=id;const b=document.getElementById("rename-bar");b.classList.add("open");const i=document.getElementById("rename-inp");i.value=ST.playthroughs[id]?.name||"";i.focus();DD=false;renderDD();}
function commitRename(){if(!RI)return;const v=document.getElementById("rename-inp").value.trim();if(v&&ST.playthroughs[RI]){ST.playthroughs[RI].name=v;save();}cancelRename();}
function cancelRename(){RI=null;document.getElementById("rename-bar").classList.remove("open");render();}
function setFilter(f){AF=f;document.querySelectorAll(".fbtn").forEach(b=>{const g=G(),act=b.dataset.f===f;b.style.borderColor=act?g.accent:"#2a2218";b.style.color=act?g.accent:"#5a4a38";b.style.background=act?g.accent+"22":"transparent";});renderSections();}
function toggleSec(k){CO[k]=!CO[k];renderSections();}
function resetPt(){if(!confirm("Reset \""+PT()?.name+"\"?"))return;PT().checked={};save();render();}
function render(){
  const g=G();
  document.body.style.background=g.bg;
  document.getElementById("header").style.background=g.bg;
  document.getElementById("header").style.borderColor=g.accent+"44";
  document.getElementById("title-sub").style.color=g.accent;
  document.getElementById("title-main").textContent=g.label.toUpperCase();
  document.getElementById("pt-btn").style.borderColor=g.accent+"55";
  document.getElementById("pt-btn").style.color=g.accent;
  document.getElementById("pt-name").textContent="▶ "+(PT()?.name||"—");
  document.getElementById("rename-inp").style.borderColor=g.accent+"88";
  document.getElementById("rename-save").style.background=g.accent+"33";
  document.getElementById("rename-save").style.borderColor=g.accent+"66";
  document.getElementById("rename-save").style.color=g.accent;
  renderTabs();renderProgress();renderDD();renderFilters();renderSections();
}
function renderTabs(){
  const c=document.getElementById("tabs");c.innerHTML="";
  GAMES.forEach(g=>{
    const pt=ST.playthroughs[ST.activePerGame[g.id]];
    const items=g.sections.flatMap(s=>s.items);
    const done=items.filter(i=>pt?.checked?.[i.id]).length;
    const pct=items.length?Math.round(done/items.length*100):0;
    const cnt=Object.values(ST.playthroughs).filter(p=>p.gameId===g.id).length;
    const act=g.id===AG;
    const b=document.createElement("button");
    b.className="tab";
    b.style.borderBottomColor=act?g.accent:"transparent";
    b.style.color=act?g.accent:"#6a5a4a";
    b.style.background=act?g.accent+"22":"transparent";
    b.innerHTML=g.shortLabel+'<span class="tab-pct" style="color:'+(act?g.accent+"cc":"#4a3a2a")+'">'+pct+"%"+(cnt>1?" · "+cnt+"×":"")+"</span>";
    b.onclick=()=>switchGame(g.id);
    c.appendChild(b);
  });
}
function renderProgress(){
  const g=G(),items=g.sections.flatMap(s=>s.items),done=items.filter(i=>CH()[i.id]).length,pct=items.length?Math.round(done/items.length*100):0;
  document.getElementById("prog-txt").textContent=done+" / "+items.length+" completed";
  document.getElementById("prog-pct").textContent=pct+"%";
  document.getElementById("prog-pct").style.color=G().accent;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-fill").style.background="linear-gradient(90deg,"+G().accent+"88,"+G().accent+")";
}
function renderDD(){
  const dd=document.getElementById("dd"),g=G();
  document.getElementById("pt-arr").textContent=DD?"▴":"▾";
  dd.classList.toggle("open",DD);
  if(!DD)return;
  const pts=PTS(),items=g.sections.flatMap(s=>s.items);
  dd.innerHTML="";
  pts.forEach(pt=>{
    const done=items.filter(i=>pt.checked?.[i.id]).length,pct=items.length?Math.round(done/items.length*100):0,act=pt.id===PID();
    const row=document.createElement("div");
    row.className="dd-row"+(act?" active":"");
    if(act)row.style.background=g.accent+"18";
    row.innerHTML=`<button class="dd-name${act?" active":""}" style="color:${act?g.accent:"#a09070"}" onclick="switchPt('${pt.id}')">${act?"▶ ":"   "}${pt.name}<span class="dd-pct">${pct}%</span></button><button class="dd-act" onclick="startRenamePt('${pt.id}')">✎</button>${pts.length>1?`<button class="dd-act dd-del" onclick="deletePt('${pt.id}')">✕</button>`:""}`;
    dd.appendChild(row);
  });
  const nb=document.createElement("button");nb.id="dd-new";nb.textContent="+ New Playthrough";nb.onclick=createPt;dd.appendChild(nb);
}
function renderFilters(){
  const g=G();
  document.querySelectorAll(".fbtn").forEach(b=>{const act=b.dataset.f===AF;b.style.borderColor=act?g.accent:"#2a2218";b.style.color=act?g.accent:"#5a4a38";b.style.background=act?g.accent+"22":"transparent";});
}
function renderSections(){
  const g=G(),c=document.getElementById("sections"),ch=CH();c.innerHTML="";
  g.sections.forEach(sec=>{
    if(AF!=="all"&&sec.type!==AF)return;
    const ul=unlocked(sec),done=sec.items.filter(i=>ch[i.id]).length,ck=PID()+"_"+sec.id,coll=CO[ck],ts=TS[sec.type];
    const wrap=document.createElement("div");wrap.className="sw"+(ul?"":" locked");
    const hdr=document.createElement("button");
    hdr.className="sh"+(coll?" coll":"")+(ul?"":" lk");
    hdr.disabled=!ul;
    hdr.innerHTML=`<span class="badge" style="color:${ts.color};border-color:${ts.color}44">${ts.label}</span><span class="stitle${ul?"":" lk"}">${sec.title}</span>${ul?`<span class="scnt">${done}/${sec.items.length} ${coll?"▸":"▾"}</span>`:`<span class="lkmsg">🔒 Complete prior areas</span>`}`;
    if(ul)hdr.onclick=()=>toggleSec(ck);
    wrap.appendChild(hdr);
    if(!coll&&ul){
      const sd=document.createElement("div");sd.className="sitems";
      sec.items.forEach(item=>{
        const dn=!!ch[item.id];
        const row=document.createElement("div");row.className="irow"+(dn?" done":"");row.onclick=()=>toggleItem(item.id);
        row.innerHTML=`<div class="icb${dn?" done":""}" style="${dn?"border-color:"+g.accent+";background:"+g.accent+"44":""}"> ${dn?`<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3 5.5L8 1" stroke="${g.accent}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</div><span class="itxt${dn?" done":""}">${item.text}</span>`;
        sd.appendChild(row);
      });
      wrap.appendChild(sd);
    }
    c.appendChild(wrap);
  });
}
document.addEventListener("click",()=>{if(DD){DD=false;renderDD();}});
render();
</script>
</body>
