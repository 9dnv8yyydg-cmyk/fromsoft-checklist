{id:"sek_051",text:"Enter the Halls of Illusion — four Folding Screen Monkeys must be caught"},
{id:"sek_052",text:"Defeat Folding Screen Monkeys — one is visible, catch the others using the environment: bell silences sound monkey, dark room hides sight monkey"},
{id:"sek_053",text:"Receive the Mortal Blade — the real blade that can kill immortals, drawn from your own stomach"},
{id:"sek_054",text:"Ring the Immortal Severance Temple Bell — one of three ritual requirements"},
{id:"sek_055",text:"Find the Divine Child of Rejuvenation in the inner sanctum — give her Rice for lore and the Return ending path"},
]},
{id:"sek_valley",title:"Sunken Valley & Gun Fort",type:"main",requires:["sek_castle"],items:[
{id:"sek_056",text:"Descend into Sunken Valley from Ashina Castle"},
{id:"sek_057",text:"Light Under-Shrine Valley idol"},
{id:"sek_058",text:"Defeat Snake Eyes Shirafuji (mini-boss) — use Loaded Umbrella to deflect her rifle shots"},
{id:"sek_059",text:"Navigate the caverns — a giant snake must be avoided or distracted with firecrackers"},
{id:"sek_060",text:"Light Sunken Valley Cavern idol"},
{id:"sek_061",text:"Defeat Long-arm Centipede Sen'un (mini-boss in the cave)"},
{id:"sek_062",text:"Light Gun Fort idol — riflemen everywhere, use grapple and stealth"},
{id:"sek_063",text:"Defeat Guardian Ape in the valley below — phase 1: ape body; phase 2: headless ape with sword; use Mortal Blade to kill phase 2"},
{id:"sek_064",text:"Receive the Lotus of the Palace — one of three ritual items"},
{id:"sek_065",text:"Light Poison Pool idol — find Snake Eyes Shirahagi (mini-boss) in the poison pool"},
{id:"sek_066",text:"Defeat Snake Eyes Shirahagi — same as Shirafuji, use Umbrella"},
]},
{id:"sek_depths",title:"Ashina Depths & Mibu Village",type:"main",requires:["sek_valley"],items:[
{id:"sek_067",text:"Enter Ashina Depths from the Guardian Ape's boss area"},
{id:"sek_068",text:"Light Hidden Forest idol"},
{id:"sek_069",text:"Navigate Hidden Forest — spirit monkeys cause hallucinations (use Snap Seeds to clear immediately)"},
{id:"sek_070",text:"Defeat Tokujiro the Glutton (mini-boss) — has a friend monkey, use Puppeteer Ninjutsu on the monkey"},
{id:"sek_071",text:"Defeat Guardian Ape's mate — a duo fight; both are headless in phase 2"},
{id:"sek_072",text:"Light Mibu Village idol"},
{id:"sek_073",text:"The possessed villagers whisper 'more sake' — give sake to the woman at the water mill for dialogue"},
{id:"sek_074",text:"Defeat O'Rin of the Water (mini-boss) — aggressive ghost on the bridge, high posture damage with charged strikes"},
{id:"sek_075",text:"Light Water Mill idol"},
{id:"sek_076",text:"Defeat Corrupted Monk (illusion version) — use Snap Seeds to instantly reveal her true form, then deathblow"},
{id:"sek_077",text:"Receive the Shelter Stone — one of three ritual items"},
]},
{id:"sek_fountainhead",title:"Fountainhead Palace",type:"main",requires:["sek_depths","sek_senpou"],items:[
{id:"sek_078",text:"Travel to Fountainhead Palace — accessed after gathering all three ritual items"},
{id:"sek_079",text:"Light Fountainhead Palace idol"},
{id:"sek_080",text:"Navigate the flooded palace — Okami warriors and noble enemies"},
{id:"sek_081",text:"Defeat Sakura Bull of the Palace (mini-boss) — use fire, stay mobile"},
{id:"sek_082",text:"Talk to the Pot Nobles — trade Treasure Carp Scales for key items including the Truly Precious Bait"},
{id:"sek_c01",type:"choice",question:"Which Pot Noble do you feed the Truly Precious Bait to?",options:[
{id:"sek_c01_haru",label:"Feed Harunaga (Fountainhead Palace)",note:"Harunaga survives and gives you a Lapis Lazuli (rare upgrade material). Koremori dies.",opens:[],closes:[]},
{id:"sek_c01_kore",label:"Feed Koremori (Hirata Estate memory)",note:"Koremori survives. Harunaga dies.",opens:[],closes:[]},
]},
{id:"sek_083",text:"Defeat Palace Noble Harunaga (mini-boss) — his ringing bell summons enemies"},
{id:"sek_084",text:"Defeat Corrupted Monk (true form) — three-phase fight, use Bloodsmoke Ninjutsu for free deathblows"},
{id:"sek_085",text:"Enter the Divine Realm"},
{id:"sek_086",text:"Defeat Divine Dragon — use the tree branches to summon lightning, redirect to the dragon"},
{id:"sek_087",text:"Receive the Divine Dragon's Tears — the final ritual item"},
]},
{id:"sek_invaded",title:"Invaded Ashina — Final Stretch",type:"main",requires:["sek_fountainhead"],items:[
{id:"sek_088",text:"Return to Ashina — the castle is under siege, everything is on fire"},
{id:"sek_089",text:"Light the Ashina Castle idol (invaded version)"},
{id:"sek_090",text:"Defeat Lone Shadow Masanaga the Spear-Bearer (mini-boss in the courtyard)"},
{id:"sek_091",text:"Defeat Shigekichi of the Red Guard (mini-boss)"},
{id:"sek_092",text:"Light Upper Tower – Antechamber idol (invaded)"},
{id:"sek_093",text:"Defeat Genichiro Ashina on the castle rooftop — he uses the Black Mortal Blade and transforms into Isshin"},
{id:"sek_094",text:"Defeat Isshin, the Sword Saint — three phases: spear → lightning spear → wind slash; arguably the best boss in FromSoft history"},
]},
{id:"sek_endings",title:"Endings",type:"main",requires:["sek_invaded"],items:[
{id:"sek_c02",type:"choice",question:"Which ending do you take?",options:[
{id:"sek_c02_shura",label:"Shura (earliest choice — missable)",note:"When Owl asks you to betray Kuro at the castle rooftop (mid-game), agree. Fight Emma then Isshin Ashina. Bad ending — Wolf becomes the demon Shura.",opens:[],closes:[]},
{id:"sek_c02_severance",label:"Immortal Severance (default)",note:"Use Kuro's blood and the Everblossom to sever the Dragon's Heritage. Wolf dies, Kuro is freed from immortality.",opens:[],closes:[]},
{id:"sek_c02_purification",label:"Purification",note:"Requires: get Everblossom from Emma → give it to her → trigger second Hirata Estate visit (Father's Bell Charm) → defeat Owl (Father) → return the lotus. Wolf and Kuro both sacrifice themselves.",opens:[],closes:[]},
{id:"sek_c02_return",label:"Return (True ending)",note:"Requires: Divine Child questline (Rice → Persimmon → Frozen Tears) → give Frozen Tears to Kuro → after final boss, Wolf sacrifices himself so Kuro can return to the Divine Realm. The most complete ending.",opens:[],closes:[]},
]},
]},
{id:"sek_upgrades",title:"Upgrades & Collectibles",type:"missable",items:[
{id:"sek_095",text:"Gourd Seeds (9 total — max 10 heals from Healing Gourd): Ashina Outskirts ×2, Hirata Estate ×1, Ashina Castle ×2, Senpou Temple ×1, Sunken Valley ×1, Mibu Village ×1, Fountainhead Palace ×1 — give all to Emma at the temple"},
{id:"sek_096",text:"Prayer Beads (40 total — every 4 increases max Vitality and Posture): dropped by nearly every mini-boss and hidden in chests throughout all zones"},
{id:"sek_097",text:"Skill trees: Shinobi Arts (Tengu), Ashina Arts (Isshin), Senpou Temple Arts (head monk), Prosthetic Arts (Sculptor) — find Esoteric Texts and give to the right person"},
{id:"sek_098",text:"Prosthetic Tools: Shuriken Wheel (castle water wheel), Flame Vent (Outskirts), Loaded Umbrella (merchant), Loaded Axe (Hirata), Sabimaru (Ashina Castle store room), Divine Abduction (Senpou), Finger Whistle (Guardian Ape drop)"},
{id:"sek_099",text:"Upgrade materials for tools: Scrap Iron, Scrap Magnetite, Black Gunpowder, Fulminated Mercury, Adamantite Scrap, Lump of Fat Wax, Lump of Grave Wax — from merchants and enemies"},
{id:"sek_100",text:"Sake items for NPC lore: Unrefined Sake, Dragonspring Sake, Monkey Booze, Dokan's Sake, Ashina Sake — give to Sculptor and Emma for backstory about the Orangutan and the old days"},
]},
{id:"sek_questlines",title:"NPC Questlines",type:"missable",items:[
{id:"sek_101",text:"Emma the Physician: talk frequently, give sake → she reveals Sculptor's past as Orangutan → key to Purification and Return endings — do NOT skip her dialogue"},
{id:"sek_102",text:"Divine Child of Rejuvenation (Senpou): give Rice → she sends you for Taro Persimmon (Mibu Village) → she gives Frozen Tears → needed for Return ending"},
{id:"sek_103",text:"Hanbei the Undying: training partner → after getting the Mortal Blade, he asks you to kill him (he is immortal and suffering) → use the Mortal Blade to give him death"},
{id:"sek_104",text:"Tengu of Ashina (Isshin disguised): gives Shinobi Esoteric Text in exchange for killing 10 red-eyed Shura enemies → quest complete"},
{id:"sek_105",text:"Pot Noble Harunaga & Koremori: trade Treasure Carp Scales for rare items — only one pot noble survives per playthrough depending on who gets the Truly Precious Bait"},
]},
]},
{id:"er",label:"Elden Ring",shortLabel:"ER",accent:"#d4af5a",bg:"#0a0906",sections:[
{id:"er_limgrave",title:"Limgrave — Opening",type:"main",items:[
{id:"er_001",text:"Escape the Cave of Knowledge tutorial — defeat the Grafted Scion OR die to it (both work)"},
{id:"er_002",text:"Arrive at the First Step Site of Grace"},
{id:"er_003",text:"Talk to Melina at a Site of Grace after resting at 3 — receive Torrent the spirit horse"},
{id:"er_004",text:"Find Kalé at the Church of Elleh — buy the Crafting Kit and Telescope"},
{id:"er_005",text:"Visit Church of Elleh at night — Renna appears and gives you the Spirit Calling Bell and Lone Wolf Ashes"},
{id:"er_006",text:"Collect Limgrave West and East map fragments"},
{id:"er_007",text:"Find Roderika at Stormhill Shack — she is traumatized; exhaust her dialogue and give her the Chrysalids' Memento (from Stormveil)"},
{id:"er_008",text:"Send Roderika to Roundtable Hold — she becomes a Spirit Tuner (upgrades Spirit Ashes)"},
{id:"er_009",text:"Find Iron Fist Alexander stuck in a hole near Saintsbridge — smack his back to free him"},
{id:"er_010",text:"Find the Warmaster's Shack — Knight Bernahl sells Ashes of War"},
{id:"er_011",text:"Defeat Margit, the Fell Omen — use Margit's Shackle (bought from Patches) to stagger him twice"},
{id:"er_012",text:"Navigate Stormveil Castle — Gostoc opens the side gate if you agree"},
{id:"er_013",text:"Find the Curved Sword Talisman and other hidden loot in Stormveil"},
{id:"er_014",text:"Find the Chrysalids' Memento in Stormveil (give to Roderika)"},
{id:"er_015",text:"Defeat Godrick the Grafted — grafts a dragon arm in phase 2; receive Godrick's Great Rune"},
{id:"er_016",text:"Activate Godrick's Great Rune at the Divine Tower of Limgrave (east of Stormveil)"},
]},
{id:"er_weeping",title:"Weeping Peninsula",type:"optional",requires:["er_limgrave"],items:[
{id:"er_017",text:"Cross the Bridge of Sacrifice south of Limgrave"},
{id:"er_018",text:"Find Irina on the road — she gives you a letter for her father Edgar"},
{id:"er_019",text:"Find Edgar the Revenger at Castle Morne — deliver Irina's letter, he refuses to leave"},
{id:"er_020",text:"Defeat Leonine Misbegotten at Castle Morne — drops the Grafted Blade Greatsword"},
{id:"er_021",text:"Return to Irina — she has been killed. Edgar becomes Edgar the Revenger and invades you later"},
{id:"er_022",text:"Find the Church of Pilgrimage — Sacred Tear #1"},
{id:"er_023",text:"Find the Fourth Church of Marika — Sacred Tear #2"},
]},
{id:"er_liurnia",title:"Liurnia of the Lakes",type:"main",requires:["er_limgrave"],items:[
{id:"er_024",text:"Reach Liurnia — via Stormveil OR around the east side of the castle"},
{id:"er_025",text:"Collect Liurnia West and East map fragments"},
{id:"er_026",text:"Find the Glintstone Key in the pond south of the Academy (guarded by a dragon)"},
{id:"er_027",text:"Find Roderika at Roundtable Hold — confirm her as Spirit Tuner after talking to Hewg"},
{id:"er_028",text:"Find White-Faced Varré at the Rose Church — he gives Festering Bloody Fingers (invade 3 times) for his questline"},
{id:"er_029",text:"Complete Varré's questline: invade 3 times → anoint the cloth with a maiden's blood (Fia or Church of Inhibition) → receive Pureblood Knight's Medal → teleport to Mohgwyn Palace"},
{id:"er_030",text:"Defeat Red Wolf of Radagon inside the Academy"},
{id:"er_031",text:"Defeat Rennala, Queen of the Full Moon — phase 1: break golden shield (kill golden students); phase 2: direct fight"},
{id:"er_032",text:"Receive the Great Rune of the Unborn — allows respec/rebirth at Rennala (costs a Larval Tear)"},
{id:"er_033",text:"Find Miriel, Pastor of Vows at the Church of Vows — absolves sins, teaches sorceries and incantations"},
{id:"er_034",text:"Explore Caria Manor — Royal Knight Loretta guards the way to Three Sisters"},
{id:"er_035",text:"Defeat Royal Knight Loretta in Caria Manor"},
{id:"er_036",text:"Enter Three Sisters — find Ranni's Rise, Renna's Rise, Seluvis's Rise"},
{id:"er_037",text:"Find Sellen at Waypoint Ruins (Limgrave) — she teaches sorceries and has a questline"},
{id:"er_038",text:"Explore the Ruin-Strewn Precipice at the north end of Liurnia — leads to Altus Plateau"},
]},
{id:"er_ranni",title:"Ranni's Questline",type:"optional",requires:["er_liurnia"],items:[
{id:"er_039",text:"Talk to Ranni at Ranni's Rise (Three Sisters) at night — she recruits you as her servant"},
{id:"er_040",text:"Talk to Ranni's servants: Blaidd the Half-Wolf, Iji the war counselor, Seluvis the sorcerer"},
{id:"er_041",text:"Defeat Starscourge Radahn — his death causes a meteorite to fall, opening Nokron"},
{id:"er_042",text:"Enter Nokron, Eternal City via the crater in Mistwood (Limgrave)"},
{id:"er_043",text:"Defeat Mimic Tear in Nokron — it copies your exact build and equipment"},
{id:"er_044",text:"Find the Fingerslayer Blade in the Night's Sacred Ground chest"},
{id:"er_045",text:"Give the Fingerslayer Blade to Ranni — she gives you the Carian Inverted Statue"},
{id:"er_046",text:"Use the Carian Inverted Statue at the Carian Study Hall — inverts the building"},
{id:"er_047",text:"Find the Cursemark of Death at the top of the inverted Carian Study Hall"},
{id:"er_048",text:"Access Ainsel River Main via the sending gate in Ranni's Rise — pick up the miniature Ranni doll"},
{id:"er_049",text:"Rest at a site of grace 3 times with the doll in your inventory — Ranni wakes up inside it"},
{id:"er_050",text:"Defeat Baleful Shadow (Blaidd's shadow form) in Ainsel River"},
{id:"er_051",text:"Cross the Lake of Rot — use Preserving Boluses or stack immunity; find the Grand Cloister"},
{id:"er_052",text:"Defeat Astel, Naturalborn of the Void — alien boss with shooting stars and a grab that deletes HP"},
{id:"er_053",text:"Ascend to the Moonlight Altar plateau"},
{id:"er_054",text:"Defeat Glintstone Dragon Adula (mini-boss on the plateau)"},
{id:"er_055",text:"Find the Cathedral of Manus Celes — Ranni is inside, place the Dark Moon Ring on her finger"},
{id:"er_056",text:"After defeating Radagon and Elden Beast: Ranni's blue summon sign appears outside — summon her for the Age of Stars ending"},
]},
{id:"er_caelid",title:"Caelid & Dragonbarrow",type:"main",requires:["er_limgrave"],items:[
{id:"er_057",text:"Collect Caelid and Dragonbarrow map fragments"},
{id:"er_058",text:"Find Millicent at the Church of the Plague — she has scarlet rot; give her the Unalloyed Gold Needle (craft from Cleanrot Knight drop in Stillwater Cave)"},
{id:"er_059",text:"Find Gurranq, Beast Clergyman at the Bestial Sanctum (Dragonbarrow) — give him Deathroot for incantations"},
{id:"er_060",text:"Defeat Starscourge Radahn at Redmane Castle (Festival of the Stars) — massive fight with NPC summons"},
{id:"er_061",text:"After Radahn: meteorite falls in Mistwood (Limgrave) — opens the path to Nokron"},
{id:"er_062",text:"Defeat Decaying Ekzykes (optional dragon boss on the road through Caelid)"},
{id:"er_063",text:"Explore Cathedral of Dragon Communion — buy dragon breath incantations with Dragon Hearts"},
]},
{id:"er_altus",title:"Altus Plateau & Leyndell",type:"main",requires:["er_liurnia"],items:[
{id:"er_064",text:"Reach Altus Plateau via Grand Lift of Dectus (need both Dectus Medallion halves) OR via Ruin-Strewn Precipice"},
{id:"er_065",text:"Collect the Altus Plateau map fragment"},
{id:"er_066",text:"Find the Shaded Castle — get the Valkyrie's Prosthesis for Millicent's questline"},
{id:"er_067",text:"Find Goldmask and Brother Corhyn near the Erdtree Gazing Hill — follow them for the Goldmask ending"},
{id:"er_068",text:"Solve Goldmask's riddle: use the Law of Regression sorcery at the Erdtree Sanctuary statue in Leyndell"},
{id:"er_c01",type:"choice",question:"Do you join Volcano Manor?",options:[
{id:"er_c01_join",label:"Join Volcano Manor (via Rya or the abductor virgin)",note:"Complete assassination contracts for Tanith — unlock Rykard boss fight and unique rewards. Rya/Zorayas questline here.",opens:["er_volcano"],closes:[]},
{id:"er_c01_skip",label:"Skip Volcano Manor entirely",note:"Miss Rykard's boss fight and Tanith's unique armor set. Rya questline not available.",opens:[],closes:["er_volcano"]},
]},
{id:"er_069",text:"Defeat the Draconic Tree Sentinel guarding the main Leyndell gate"},
{id:"er_070",text:"Collect the Leyndell, Royal Capital map fragment"},
{id:"er_071",text:"Defeat Godfrey, First Elden Lord (golden shade) — phantom boss in Leyndell"},
{id:"er_072",text:"Defeat Morgott, the Omen King — Margit reveals his true form; receive Morgott's Great Rune and the Rold Medallion"},
{id:"er_073",text:"Use the Rold Medallion at the Grand Lift of Rold — ascend to Mountaintops of the Giants"},
]},
{id:"er_volcano",title:"Volcano Manor",type:"optional",items:[
{id:"er_074",text:"Join via Rya at the Lux Ruins (Liurnia) — she gives an invitation"},
{id:"er_075",text:"Talk to Tanith — agree to join and do assassination contracts"},
{id:"er_076",text:"Assassination target 1: Old Knight Istvan (Limgrave) — NPC invasion near Stormhill"},
{id:"er_077",text:"Assassination target 2: Rileigh the Idle (Altus Plateau)"},
{id:"er_078",text:"Assassination target 3: Juno Hoslow (Mountaintops of the Giants)"},
{id:"er_079",text:"Rya/Zorayas questline: find her true serpent form, give her the Tonic of Forgetfulness OR let her remember"},
{id:"er_c02",type:"choice",question:"Rya (Zorayas) — how do you handle her situation?",options:[
{id:"er_c02_tonic",label:"Give her the Tonic of Forgetfulness (from Seluvis or buy)",note:"She forgets her true nature and disappears happily. You find her armor in her room.",opens:[],closes:[]},
{id:"er_c02_kill",label:"Kill her at her request (mercy kill)",note:"She thanks you for ending her suffering. You get her armor.",opens:[],closes:[]},
{id:"er_c02_leave",label:"Leave her to figure it out",note:"She stays in her room indefinitely. No reward.",opens:[],closes:[]},
]},
{id:"er_080",text:"Defeat Rykard, Lord of Blasphemy — use the Serpent-Hunter great spear found in the arena; poke him from range"},
]},
{id:"er_underground",title:"Underground: Siofra, Nokron, Ainsel, Deeproot",type:"optional",requires:["er_liurnia"],items:[
{id:"er_081",text:"Siofra River: enter via the well in Mistwood (Limgrave) — underground Erdtree region"},
{id:"er_082",text:"Light the eight flames to summon the Ancestor Spirit (optional boss)"},
{id:"er_083",text:"Defeat Ancestor Spirit and Regal Ancestor Spirit (Nokron version)"},
{id:"er_084",text:"Mohgwyn Palace: via Varré's questline (Pureblood Knight's Medal) OR via secret teleporter in Consecrated Snowfield"},
{id:"er_085",text:"Defeat Mohg, Lord of Blood — use Purifying Crystal Tear in Flask of Wondrous Physick to nullify his blood curse in phase 2"},
{id:"er_086",text:"Deeproot Depths: accessible from Nokron waterfall or Siofra Aqueduct"},
{id:"er_087",text:"Find Fia, Deathbed Companion in Deeproot Depths — give her the Cursemark of Death (from Carian Study Hall)"},
{id:"er_088",text:"Defeat Lichdragon Fortissax (Fia's questline boss) — enter her dream, dragon with lightning attacks"},
{id:"er_089",text:"Receive the Mending Rune of the Death-Prince from Fia — needed for Duskborn ending"},
]},
{id:"er_giants",title:"Mountaintops of the Giants",type:"main",requires:["er_altus"],items:[
{id:"er_090",text:"Collect Mountaintops of the Giants map fragment"},
{id:"er_091",text:"Find the right half of the Haligtree Secret Medallion at the Village of the Albinaurics (Liurnia)"},
{id:"er_092",text:"Find the left half at Castle Sol — defeat Commander Niall to access it"},
{id:"er_093",text:"Defeat Commander Niall — knight with two crucible knight summons; kill the summons first"},
{id:"er_094",text:"Defeat Fire Giant — attack the ankle, then his eye after phase 2 rolls; largest boss in the game"},
{id:"er_095",text:"Speak to Melina at the Forge of the Giants — she sacrifices herself to burn the Erdtree"},
{id:"er_c03",type:"choice",question:"How do you burn the Erdtree?",options:[
{id:"er_c03_melina",label:"Let Melina sacrifice herself (normal path)",note:"Melina burns the Erdtree and disappears. Standard for most endings.",opens:[],closes:[]},
{id:"er_c03_flame",label:"Use the Frenzied Flame (Lord of Frenzied Flame path)",note:"Requires finding the Three Fingers under Leyndell first (strip all armor). Melina leaves in disgust and becomes hostile. Required for the Frenzied Flame ending.",opens:["er_frenzied"],closes:[]},
]},
]},
{id:"er_frenzied",title:"Lord of Frenzied Flame Path",type:"optional",items:[
{id:"er_096",text:"Find the underground Subterranean Shunning-Grounds beneath Leyndell"},
{id:"er_097",text:"Navigate to the very bottom — remove ALL armor and equipment to open the final door"},
{id:"er_098",text:"The Three Fingers embrace you — you become the vessel of the Frenzied Flame"},
{id:"er_099",text:"Melina appears one final time and swears to become your Kindling Maiden to kill you"},
{id:"er_100",text:"After defeating Radagon and Elden Beast: incinerate the Erdtree with the Frenzied Flame"},
{id:"er_101",text:"Optional: to undo the Frenzied Flame (to get a different ending), use Miquella's Needle (obtained after defeating Malenia) in the Dragonlord Placidusax arena"},
]},
{id:"er_haligtree",title:"Consecrated Snowfield & Haligtree",type:"optional",requires:["er_giants"],items:[
{id:"er_102",text:"Use both halves of the Haligtree Secret Medallion at the Grand Lift of Rold — select Hoist Secret Medallion"},
{id:"er_103",text:"Enter Consecrated Snowfield — blizzard reduces visibility significantly"},
{id:"er_104",text:"Collect the Consecrated Snowfield map fragment"},
{id:"er_105",text:"Find the teleporter to Mohgwyn Palace in western Consecrated Snowfield (if you haven't done Varré's route)"},
{id:"er_106",text:"Find Ordina, Liturgical Town — solve the puzzle (light 4 torches while invisible enemies hunt you) to open the Haligtree portal"},
{id:"er_107",text:"Enter Miquella's Haligtree and collect the map fragment"},
{id:"er_108",text:"Defeat Loretta, Knight of the Haligtree (harder version than Caria Manor)"},
{id:"er_109",text:"Descend to Elphael, Brace of the Haligtree"},
{id:"er_110",text:"Find Millicent's questline conclusion"},
{id:"er_c04",type:"choice",question:"Millicent — help her or betray her?",options:[
{id:"er_c04_help",label:"Help Millicent (fight her sisters for her)",note:"She thanks you and eventually passes away peacefully. You receive the Unalloyed Gold Needle afterward — give to Gowry or use to make Miquella's Needle (undoes Frenzied Flame)",opens:[],closes:[]},
{id:"er_c04_betray",label:"Betray Millicent (summon the invasion sign instead)",note:"You invade her world and kill her. You receive Millicent's Prosthesis talisman.",opens:[],closes:[]},
]},
{id:"er_111",text:"Defeat Malenia, Blade of Miquella — widely considered the hardest boss in FromSoft history; she heals on every hit including blocked hits; two phases"},
]},
{id:"er_farum",title:"Crumbling Farum Azula",type:"main",requires:["er_giants"],items:[
{id:"er_112",text:"Teleported here automatically after burning the Erdtree"},
{id:"er_113",text:"Collect the Farum Azula map fragment"},
{id:"er_114",text:"Navigate the floating ruins — beastmen, ancient dragons, and crumbling architecture"},
{id:"er_115",text:"Find the Dragonlord Placidusax secret arena — walk to the edge of a certain ruined platform and use the Lie Down gesture"},
{id:"er_116",text:"Defeat Dragonlord Placidusax (optional) — two-headed ancient dragon, one of the best boss fights in the game"},
{id:"er_117",text:"Defeat Godskin Duo — Godskin Noble and Godskin Apostle simultaneously; they have a shared HP pool"},
{id:"er_118",text:"Defeat Maliketh, the Black Blade — two phases: Beast Clergyman → Maliketh; each attack in phase 2 drains your max HP"},
{id:"er_119",text:"Teleported back to Leyndell — now the Ashen Capital"},
]},
{id:"er_ashen",title:"Leyndell, Ashen Capital & Endgame",type:"main",requires:["er_farum"],items:[
{id:"er_120",text:"Navigate Ashen Leyndell — same layout but ash-covered, different enemies"},
{id:"er_121",text:"Find Goldmask's conclusion on the broken bridge — he has solved the riddle (if you completed his quest)"},
{id:"er_122",text:"Defeat Sir Gideon Ofnir, the All-Knowing — sorcerer boss who uses all the Great Rune spells"},
{id:"er_123",text:"Defeat Godfrey, First Elden Lord (true form) — two phases: axe combat → fist combat; excellent boss design"},
{id:"er_124",text:"Ascend to the Elden Throne"},
{id:"er_125",text:"Defeat Radagon of the Golden Order — fast hammer boss; holy damage and Black Flame work well"},
{id:"er_126",text:"Immediately transitions to Elden Beast — massive cosmic entity; stay close, deal holy damage"},
{id:"er_c05",type:"choice",question:"Which ending do you choose?",options:[
{id:"er_c05_lord",label:"Elden Lord (default)",note:"Approach the fractured Elden Ring and mend it — you become Elden Lord",opens:[],closes:[]},
{id:"er_c05_stars",label:"Age of Stars (Ranni's ending)",note:"Requires completing Ranni's full questline. After Elden Beast: Ranni's blue summon sign appears — call her, then walk away with her",opens:[],closes:[]},
{id:"er_c05_frenzied",label:"Lord of Frenzied Flame",note:"Requires the Three Fingers embrace. After Elden Beast: incinerate the Erdtree and burn the world",opens:[],closes:[]},
{id:"er_c05_duskborn",label:"Age of the Duskborn (Fia's ending)",note:"Requires completing Fia's questline and receiving the Mending Rune of the Death-Prince. Use the rune after Elden Beast.",opens:[],closes:[]},
{id:"er_c05_order",label:"Blessing of Despair / Perfect Order (minor endings)",note:"Use Dung Eater's Mending Rune (Blessing of Despair) or Goldmask's Mending Rune (Perfect Order) after Elden Beast",opens:[],closes:[]},
]},
]},
{id:"er_dlc",title:"DLC: Shadow of the Erdtree",type:"optional",requires:["er_ashen"],items:[
{id:"er_127",text:"Prerequisites: defeat Mohg, Lord of Blood AND interact with Miquella's Cocoon in Mohg's arena"},
{id:"er_128",text:"Enter the Realm of Shadow — a parallel world under Miquella's influence"},
{id:"er_129",text:"Collect the Gravesite Plain map fragment"},
{id:"er_130",text:"CRITICAL: collect Scadutree Fragments (max 20) and Revered Spirit Ashes (max 10) throughout the DLC — these buff your attack and defense specifically in the Shadow Realm; bosses are brutal without them"},
{id:"er_131",text:"Find Leda at the first Site of Grace — she is one of Miquella's followers, questline begins"},
{id:"er_132",text:"Explore the Shadow Keep — large castle with multiple paths"},
{id:"er_133",text:"Defeat Rellana, Twin Moon Knight — fast dual-blade knight with moon sorcery combos"},
{id:"er_134",text:"Find the Scadutree Avatar near the Minor Erdtree of Shadow (optional — a tree avatar boss)"},
{id:"er_135",text:"Defeat Messmer the Impaler — fire spear wielder, transforms into a serpent in phase 2"},
{id:"er_136",text:"Navigate the Abyssal Woods — avoid the Lamenter (nearly unkillable, causes madness), find Midra's area"},
{id:"er_137",text:"Defeat Midra, Lord of Frenzied Flame (optional) — two phases: desperate man → Frenzied Flame avatar"},
{id:"er_138",text:"Reach the Jagged Peak — Bayle the Dread is here (optional dragon boss); summon Igon NPC for a dramatic encounter"},
{id:"er_139",text:"Defeat Bayle the Dread — hardest dragon boss in the series"},
{id:"er_140",text:"Navigate the Ancient Ruins of Rauh and the Finger Ruins"},
{id:"er_141",text:"Defeat Romina, Saint of the Bud — fast scarlet rot insect-lady boss"},
{id:"er_142",text:"Enter Enir-Ilim — Miquella's inner sanctum, final DLC area"},
{id:"er_143",text:"Defeat Metyr, Mother of Fingers (optional) — cosmic horror with many fingers"},
{id:"er_144",text:"Defeat Promised Consort Radahn — Miquella has called Radahn's soul into his body; two phases; widely considered the hardest boss in FromSoft history"},
{id:"er_c06",type:"choice",question:"Leda questline — how does it resolve?",options:[
{id:"er_c06_leda",label:"Side with Leda",note:"Leda's allies survive, other followers die. Different final DLC cutscene.",opens:[],closes:[]},
{id:"er_c06_against",label:"Side against Leda",note:"Leda dies. Other followers may survive. Different cutscene outcome.",opens:[],closes:[]},
]},
]},
{id:"er_upgrades",title:"Upgrades & Collectibles",type:"missable",items:[
{id:"er_145",text:"Golden Seeds (24 total — each 1 or 2 seeds add a Flask charge, max +14 flasks total): found at Minor Erdtrees and as quest rewards throughout all regions"},
{id:"er_146",text:"Sacred Tears (12 total — each upgrades Flask healing amount): found inside churches across all regions — one per church"},
{id:"er_147",text:"Smithing Stones: regular weapons go to +25 (needs Smithing Stone [1] through [8] then Ancient Dragon Smithing Stone for final upgrade)"},
{id:"er_148",text:"Somber Smithing Stones: special/unique weapons go to +10 (Somber Ancient Dragon Smithing Stone for final upgrade)"},
{id:"er_149",text:"Spirit Ashes: found throughout the world, upgraded with Grave Glovewort (regular) or Ghost Glovewort (unique) — Roderika at Roundtable does the upgrading"},
{id:"er_150",text:"Great Runes: activate at their Divine Towers — Godrick (Limgrave tower), Morgott (Leyndell tower), Radahn (Lenne's Rise tower), Rykard (no activation needed), Malenia (Haligtree tower)"},
{id:"er_151",text:"Map fragments: one per region — Limgrave ×2, Liurnia ×2, Caelid ×2, Altus, Leyndell, Mountaintops, Siofra, Nokron, Ainsel, Deeproot, Snowfield, Haligtree ×2, Farum Azula, Shadow of the Erdtree regions ×4+"},
]},
{id:"er_questlines",title:"NPC Questlines",type:"missable",items:[
{id:"er_152",text:"Ranni: Renna gives Spirit Bell at night → recruit at Ranni's Rise → full questline through Nokron → Lake of Rot → Moonlight Altar → Age of Stars ending"},
{id:"er_153",text:"Fia the Deathbed Companion: Roundtable Hold → give embrace (receive Baldachin's Blessing) → give Cursemark of Death (Carian Study Hall) → Deeproot Depths → Lichdragon Fortissax → Duskborn ending"},
{id:"er_154",text:"Goldmask & Brother Corhyn: Altus Plateau → follow to Leyndell rooftop → solve riddle with Law of Regression sorcery → Perfect Order ending"},
{id:"er_155",text:"Dung Eater: Roundtable Hold (red phantom) → free his body in Leyndell Subterranean Shunning-Grounds → give 5 Seedbed Curses → Blessing of Despair ending"},
{id:"er_156",text:"White-Faced Varré: First Step → Rose Church → invade ×3 → anoint cloth with maiden's blood → Mohgwyn Palace access"},
{id:"er_157",text:"Millicent: Church of Plague → Unalloyed Gold Needle → Shaded Castle → multiple encounters → Haligtree conclusion (help or betray)"},
{id:"er_158",text:"Iron Fist Alexander: free in Limgrave → Redmane Castle (Radahn) → Jarburg (Liurnia) → Farum Azula → final fight for his innards (used to craft a talisman)"},
{id:"er_159",text:"Patches: Murkwater Cave (Limgrave) → Scenic Isle (Liurnia) → Volcano Manor → Shaded Castle → Leyndell — always shady, never kill him"},
{id:"er_160",text:"Nepheli Loux: Stormveil Castle → Roundtable Hold → give Ancient Dragon Smithing Stone → Village of the Albinaurics → she becomes the new ruler of Stormveil"},
]},
]},
];
