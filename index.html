<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FromSoft">
<title>FromSoft Checklist</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;background:#0a0a08;color:#c9b99a;min-height:100vh}
#header{position:sticky;top:0;z-index:20;padding:max(14px,env(safe-area-inset-top)) 16px 0;border-bottom:1px solid #c0883a44;background:#0a0a08;transition:background .4s,border-color .4s}
#title-sub{text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:4px}
#title-main{text-align:center;font-size:clamp(16px,4vw,26px);letter-spacing:.1em;color:#eeddb8;font-weight:normal;margin-bottom:10px}
#tabs{display:flex;overflow-x:auto;gap:2px;scrollbar-width:none;-ms-overflow-style:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px 10px;background:transparent;border:none;border-bottom:2px solid transparent;font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;cursor:pointer;color:#6a5a4a;font-family:Georgia,serif;transition:all .15s}
.tab-pct{font-size:9px;margin-top:1px;display:block}
#body{padding:10px 16px 0;max-width:720px;margin:0 auto}
#pt-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;position:relative}
#pt-btn{flex:1;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#171410;border-radius:4px;border:1px solid #c0883a55;color:#c0883a;font-size:12px;letter-spacing:.06em;cursor:pointer;text-align:left;font-family:Georgia,serif}
.icon-btn{padding:7px 10px;background:#171410;border:1px solid #2e2418;border-radius:4px;color:#6a5a4a;font-size:13px;cursor:pointer;font-family:Georgia,serif}
#dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1a1612;border:1px solid #c0883a44;border-radius:4px;z-index:50;overflow:hidden;box-shadow:0 8px 24px #00000088;display:none}
#dd.open{display:block}
.dd-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #2a2218}
.dd-name{flex:1;background:none;border:none;text-align:left;cursor:pointer;color:#a09070;font-size:12px;font-family:Georgia,serif}
.dd-pct{font-size:10px;color:#5a4a38;margin-left:8px}
.dd-act{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 4px;font-family:Georgia,serif;color:#4a3a28}
.dd-del{color:#4a2a2a;font-size:13px}
#dd-new{width:100%;padding:9px 12px;background:none;border:none;color:#5a4a38;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:left;font-family:Georgia,serif}
#rename-bar{display:none;gap:6px;margin-bottom:10px}
#rename-bar.open{display:flex}
#rename-inp{flex:1;padding:6px 10px;background:#171410;border:1px solid #c0883a88;border-radius:4px;color:#e0cc99;font-size:12px;outline:none;font-family:Georgia,serif}
#rename-save{padding:6px 14px;border-radius:4px;border:1px solid #c0883a66;background:#c0883a33;color:#c0883a;font-size:11px;cursor:pointer;font-family:Georgia,serif}
#rename-cancel{padding:6px 10px;background:transparent;border:1px solid #2a2218;border-radius:4px;color:#5a4a38;font-size:11px;cursor:pointer;font-family:Georgia,serif}
#prog-row{display:flex;justify-content:space-between;font-size:11px;color:#6a5a4a;margin-bottom:5px}
#prog-bg{height:3px;background:#1a1612;border-radius:2px;margin-bottom:12px}
#prog-fill{height:100%;border-radius:2px;transition:width .5s ease,background .4s;width:0}
#filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fbtn{padding:4px 12px;border-radius:20px;border:1px solid #2a2218;background:transparent;color:#5a4a38;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:Georgia,serif}
#reset-btn{margin-left:auto;padding:4px 12px;border-radius:20px;border:1px solid #2a1818;background:transparent;color:#4a2a2a;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:Georgia,serif}
#backup-row{display:flex;gap:8px;margin-bottom:12px}
#export-btn,#import-btn{flex:1;padding:8px 12px;border-radius:4px;border:1px solid #2e2418;background:#171410;font-size:11px;letter-spacing:.08em;cursor:pointer;font-family:Georgia,serif;text-transform:uppercase;transition:all .15s}
#export-btn{color:#c0c8a8;border-color:#c0c8a844}
#export-btn:hover{background:#1e1e16;border-color:#c0c8a8}
#import-btn{color:#7a9fbd;border-color:#7a9fbd44}
#import-btn:hover{background:#131820;border-color:#7a9fbd}
#sections{padding:0 0 max(80px,calc(60px + env(safe-area-inset-bottom)))}
.sw{margin-bottom:10px;transition:opacity .3s}
.sw.locked{opacity:.4;pointer-events:none}
.sh{width:100%;display:flex;align-items:center;gap:10px;background:#171410;border:1px solid #2e2418;border-radius:4px 4px 0 0;padding:11px 14px;cursor:pointer;text-align:left;font-family:Georgia,serif}
.sh.coll{border-radius:4px;background:#13110e}
.sh.lk{cursor:not-allowed}
.badge{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0}
.stitle{flex:1;font-size:13px;letter-spacing:.06em;color:#ddc99a;text-transform:uppercase}
.stitle.lk{color:#5a4a38}
.scnt{font-size:10px;color:#5a4a38;font-family:monospace}
.lkmsg{font-size:10px;color:#4a3a28}
.sitems{border:1px solid #2e2418;border-top:none;border-radius:0 0 4px 4px}
/* normal item */
.irow{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;cursor:pointer;border-top:1px solid #1a1612;transition:background .1s;background:transparent}
.irow:first-child{border-top:none}
.irow.done{background:#100e0b}
.irow:not(.done):not(.choice-row):hover{background:#1a1612}
.icb{width:15px;height:15px;min-width:15px;border:1px solid #3a2e20;border-radius:2px;display:flex;align-items:center;justify-content:center;margin-top:2px;flex-shrink:0;transition:all .15s}
.itxt{font-size:13px;line-height:1.5;color:#b09a7a}
.itxt.done{color:#3a3028;text-decoration:line-through;text-decoration-color:#3a3028}
/* choice item */
.choice-row{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid #1a1612;background:#0e0c0a}
.choice-row:first-child{border-top:none}
.choice-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7a6a58;margin-bottom:2px}
.choice-question{font-size:13px;color:#c9a96e;line-height:1.5;margin-bottom:4px}
.choice-btns{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{padding:5px 14px;border-radius:3px;border:1px solid;font-size:11px;letter-spacing:.06em;cursor:pointer;font-family:Georgia,serif;transition:all .15s}
.cbtn.unset{background:transparent;border-color:#3a2e20;color:#8a7a60}
.cbtn.chosen{background:#2a2010;border-color:#c0883a;color:#c0883a}
.cbtn.unchosen{background:transparent;border-color:#1e1a14;color:#3a3028;text-decoration:line-through;cursor:default}
/* consequence tag */
.conseq{font-size:10px;color:#5a4a38;margin-top:2px;font-style:italic}
.conseq.open-tag{color:#6a9a6a}
.conseq.close-tag{color:#9a5a5a}
</style>
</head>
<body>
<div id="header">
  <div id="title-sub">FROM SOFTWARE · COMPLETE PLAYTHROUGH GUIDE</div>
  <div id="title-main">DARK SOULS I</div>
  <div id="tabs"></div>
</div>
<div id="body">
  <div id="pt-row">
    <button id="pt-btn" onclick="toggleDD(event)">
      <span id="pt-name">▶ Playthrough 1</span>
      <span id="pt-arr">▾</span>
    </button>
    <button class="icon-btn" onclick="startRename()">✎</button>
    <button class="icon-btn" onclick="createPt()">+</button>
    <div id="dd"></div>
  </div>
  <div id="rename-bar">
    <input id="rename-inp" type="text" onkeydown="if(event.key==='Enter')commitRename();if(event.key==='Escape')cancelRename();">
    <button id="rename-save" onclick="commitRename()">Save</button>
    <button id="rename-cancel" onclick="cancelRename()">Cancel</button>
  </div>
  <div id="prog-row"><span id="prog-txt">0 / 0</span><span id="prog-pct">0%</span></div>
  <div id="prog-bg"><div id="prog-fill"></div></div>
  <div id="filter-row">
    <button class="fbtn" data-f="all" onclick="setFilter('all')">All</button>
    <button class="fbtn" data-f="main" onclick="setFilter('main')">Main</button>
    <button class="fbtn" data-f="optional" onclick="setFilter('optional')">Optional</button>
    <button class="fbtn" data-f="missable" onclick="setFilter('missable')">Missable</button>
    <button id="reset-btn" onclick="resetPt()">Reset</button>
  </div>
  <div id="backup-row">
    <button id="export-btn" onclick="exportBackup()">⬆ Export</button>
    <button id="import-btn" onclick="importBackup()">⬇ Import</button>
  </div>
  <div id="sections"></div>
</div>
<script>
// ── ITEM TYPES ────────────────────────────────────────────────────────────────
// Normal item:  { id, text }
// Choice item:  { id, type:"choice", question, options:[{id,label,opens:[sectionId],closes:[sectionId],note}] }
//   - opens: sections unlocked when this option is chosen
//   - closes: sections permanently greyed/hidden when this option is chosen

const TS={main:{label:"Main",color:"#c9a96e"},optional:{label:"Optional",color:"#6ea0c9"},missable:{label:"Missable",color:"#c96e6e"}};
const SK="fromsoft-v3";

// STATE shape per playthrough:
// { id, gameId, name, createdAt, checked:{itemId:bool}, choices:{choiceId:optionId}, collapsed:{sectionKey:bool} }

let ST=null, AG="ds1", AF="all", DD=false, RI=null;

function load(){
  try{const r=JSON.parse(localStorage.getItem(SK)||"null");if(r&&r.playthroughs)return r;}catch{}
  // GAMES must be defined before this is called
  const p={},a={};
  GAMES.forEach(g=>{const id=g.id+"_pt1";p[id]={id,gameId:g.id,name:"Playthrough 1",createdAt:Date.now(),checked:{},choices:{},collapsed:{}};a[g.id]=id;});
  return{playthroughs:p,activePerGame:a};
}
function save(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch{}}
function uid(){return Math.random().toString(36).slice(2,9);}
function G(){return GAMES.find(g=>g.id===AG);}
function PID(){return ST.activePerGame[AG];}
function PT(){return ST.playthroughs[PID()];}
function CH(){return PT()?.checked||{};}
function CHOICES(){return PT()?.choices||{};}
function COLL(){return PT()?.collapsed||{};}
function PTS(){return Object.values(ST.playthroughs).filter(p=>p.gameId===AG).sort((a,b)=>a.createdAt-b.createdAt);}

// which sections are force-closed by a choice
function closedSections(){
  const closed=new Set();
  const ch=CHOICES();
  G().sections.forEach(sec=>{
    sec.items.forEach(item=>{
      if(item.type==="choice"&&ch[item.id]){
        const chosen=item.options.find(o=>o.id===ch[item.id]);
        if(chosen&&chosen.closes)chosen.closes.forEach(s=>closed.add(s));
      }
    });
  });
  return closed;
}

// which sections are force-opened by a choice
function openedSections(){
  const opened=new Set();
  const ch=CHOICES();
  G().sections.forEach(sec=>{
    sec.items.forEach(item=>{
      if(item.type==="choice"&&ch[item.id]){
        const chosen=item.options.find(o=>o.id===ch[item.id]);
        if(chosen&&chosen.opens)chosen.opens.forEach(s=>opened.add(s));
      }
    });
  });
  return opened;
}

function isSectionUnlocked(sec){
  const closed=closedSections();
  if(closed.has(sec.id))return false;
  if(!sec.requires||!sec.requires.length)return true;
  const g=G();
  return sec.requires.every(rid=>{
    const r=g.sections.find(s=>s.id===rid);
    if(!r)return true;
    return r.items.filter(i=>i.type!=="choice"&&CH()[i.id]).length>=Math.ceil(r.items.filter(i=>i.type!=="choice").length*0.5);
  });
}

// count checkable (non-choice) items
function countable(sec){return sec.items.filter(i=>i.type!=="choice");}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function toggleItem(id){const pt=PT();if(!pt.checked)pt.checked={};pt.checked[id]=!pt.checked[id];save();render();}

function makeChoice(choiceId,optionId){
  const pt=PT();
  if(!pt.choices)pt.choices={};
  // toggle off if same
  if(pt.choices[choiceId]===optionId){delete pt.choices[choiceId];}
  else{pt.choices[choiceId]=optionId;}
  save();render();
}

function switchGame(id){AG=id;DD=false;RI=null;render();}
function toggleDD(e){e.stopPropagation();DD=!DD;renderDD();}
function switchPt(id){ST.activePerGame[AG]=id;save();DD=false;RI=null;render();}
function createPt(){
  const n=PTS().length+1,id=AG+"_"+uid();
  ST.playthroughs[id]={id,gameId:AG,name:"Playthrough "+n,createdAt:Date.now(),checked:{},choices:{},collapsed:{}};
  ST.activePerGame[AG]=id;save();DD=false;render();
}
function deletePt(id){
  if(PTS().length<=1)return;
  if(!confirm("Delete \""+ST.playthroughs[id]?.name+"\"?"))return;
  delete ST.playthroughs[id];
  const r=Object.values(ST.playthroughs).filter(p=>p.gameId===AG);
  ST.activePerGame[AG]=r[0]?.id||"";save();DD=false;render();
}
function startRename(){RI=PID();document.getElementById("rename-bar").classList.add("open");const i=document.getElementById("rename-inp");i.value=PT()?.name||"";i.focus();DD=false;renderDD();}
function startRenamePt(id){RI=id;document.getElementById("rename-bar").classList.add("open");const i=document.getElementById("rename-inp");i.value=ST.playthroughs[id]?.name||"";i.focus();DD=false;renderDD();}
function commitRename(){if(!RI)return;const v=document.getElementById("rename-inp").value.trim();if(v&&ST.playthroughs[RI])ST.playthroughs[RI].name=v;save();cancelRename();}
function cancelRename(){RI=null;document.getElementById("rename-bar").classList.remove("open");render();}
function setFilter(f){AF=f;renderFilters();renderSections();}
function toggleSec(k){const pt=PT();if(!pt.collapsed)pt.collapsed={};pt.collapsed[k]=!pt.collapsed[k];save();renderSections();}
function resetPt(){if(!confirm("Reset \""+PT()?.name+"\"?"))return;const pt=PT();pt.checked={};pt.choices={};pt.collapsed={};save();render();}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const g=G();
  document.body.style.background=g.bg;
  document.getElementById("header").style.background=g.bg;
  document.getElementById("header").style.borderColor=g.accent+"44";
  document.getElementById("title-sub").style.color=g.accent;
  document.getElementById("title-main").textContent=g.label.toUpperCase();
  document.getElementById("pt-btn").style.borderColor=g.accent+"55";
  document.getElementById("pt-btn").style.color=g.accent;
  document.getElementById("pt-name").textContent="▶ "+(PT()?.name||"—");
  document.getElementById("rename-inp").style.borderColor=g.accent+"88";
  document.getElementById("rename-save").style.background=g.accent+"33";
  document.getElementById("rename-save").style.borderColor=g.accent+"66";
  document.getElementById("rename-save").style.color=g.accent;
  renderTabs();renderProgress();renderDD();renderFilters();renderSections();
}

function renderTabs(){
  const c=document.getElementById("tabs");c.innerHTML="";
  GAMES.forEach(g=>{
    const pt=ST.playthroughs[ST.activePerGame[g.id]];
    const items=g.sections.flatMap(s=>countable(s));
    const done=items.filter(i=>pt?.checked?.[i.id]).length;
    const pct=items.length?Math.round(done/items.length*100):0;
    const cnt=Object.values(ST.playthroughs).filter(p=>p.gameId===g.id).length;
    const act=g.id===AG;
    const b=document.createElement("button");
    b.className="tab";
    b.style.borderBottomColor=act?g.accent:"transparent";
    b.style.color=act?g.accent:"#6a5a4a";
    b.style.background=act?g.accent+"22":"transparent";
    b.innerHTML=g.shortLabel+'<span class="tab-pct" style="color:'+(act?g.accent+"cc":"#4a3a2a")+'">'+pct+"%"+(cnt>1?" · "+cnt+"×":"")+"</span>";
    b.onclick=()=>switchGame(g.id);
    c.appendChild(b);
  });
}

function renderProgress(){
  const g=G();
  const items=g.sections.flatMap(s=>countable(s));
  const done=items.filter(i=>CH()[i.id]).length;
  const pct=items.length?Math.round(done/items.length*100):0;
  document.getElementById("prog-txt").textContent=done+" / "+items.length+" completed";
  document.getElementById("prog-pct").textContent=pct+"%";
  document.getElementById("prog-pct").style.color=g.accent;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-fill").style.background="linear-gradient(90deg,"+g.accent+"88,"+g.accent+")";
}

function renderDD(){
  const dd=document.getElementById("dd"),g=G();
  document.getElementById("pt-arr").textContent=DD?"▴":"▾";
  dd.classList.toggle("open",DD);
  if(!DD)return;
  const pts=PTS();
  const items=g.sections.flatMap(s=>countable(s));
  dd.innerHTML="";
  pts.forEach(pt=>{
    const done=items.filter(i=>pt.checked?.[i.id]).length;
    const pct=items.length?Math.round(done/items.length*100):0;
    const act=pt.id===PID();
    const row=document.createElement("div");
    row.className="dd-row"+(act?" active":"");
    if(act)row.style.background=g.accent+"18";
    row.innerHTML=`<button class="dd-name${act?" active":""}" style="color:${act?g.accent:"#a09070"}" onclick="switchPt('${pt.id}')">${act?"▶ ":"   "}${pt.name}<span class="dd-pct">${pct}%</span></button><button class="dd-act" onclick="startRenamePt('${pt.id}')">✎</button>${pts.length>1?`<button class="dd-act dd-del" onclick="deletePt('${pt.id}')">✕</button>`:""}`;
    dd.appendChild(row);
  });
  const nb=document.createElement("button");nb.id="dd-new";nb.textContent="+ New Playthrough";nb.onclick=createPt;dd.appendChild(nb);
}

function renderFilters(){
  const g=G();
  document.querySelectorAll(".fbtn").forEach(b=>{
    const act=b.dataset.f===AF;
    b.style.borderColor=act?g.accent:"#2a2218";
    b.style.color=act?g.accent:"#5a4a38";
    b.style.background=act?g.accent+"22":"transparent";
  });
}

function renderSections(){
  const g=G(),c=document.getElementById("sections"),ch=CH(),choicesMap=CHOICES(),coll=COLL();
  const closed=closedSections();
  c.innerHTML="";
  g.sections.forEach(sec=>{
    if(AF!=="all"&&sec.type!==AF)return;
    const isClosed=closed.has(sec.id);
    const ul=!isClosed&&isSectionUnlocked(sec);
    const items=countable(sec);
    const done=items.filter(i=>ch[i.id]).length;
    const ck=PID()+"_"+sec.id;
    const isColl=coll[ck];
    const ts=TS[sec.type];

    const wrap=document.createElement("div");
    wrap.className="sw"+(ul?"":" locked");
    if(isClosed)wrap.style.opacity="0.25";

    const hdr=document.createElement("button");
    hdr.className="sh"+(isColl?" coll":"")+(ul?"":" lk");
    hdr.disabled=!ul;
    let hdrRight=ul
      ?`<span class="scnt">${done}/${items.length} ${isColl?"▸":"▾"}</span>`
      :isClosed
        ?`<span class="lkmsg">✗ Closed by your choices</span>`
        :`<span class="lkmsg">🔒 Complete prior areas</span>`;
    hdr.innerHTML=`<span class="badge" style="color:${ts.color};border-color:${ts.color}44">${ts.label}</span><span class="stitle${ul?"":" lk"}">${sec.title}</span>${hdrRight}`;
    if(ul)hdr.onclick=()=>toggleSec(ck);
    wrap.appendChild(hdr);

    if(!isColl&&ul){
      const sd=document.createElement("div");sd.className="sitems";
      sec.items.forEach(item=>{
        if(item.type==="choice"){
          // render choice widget
          const row=document.createElement("div");row.className="choice-row";
          const lbl=document.createElement("div");lbl.className="choice-label";lbl.textContent="⚑ Choice";
          const q=document.createElement("div");q.className="choice-question";q.textContent=item.question;
          const btns=document.createElement("div");btns.className="choice-btns";
          const currentChoice=choicesMap[item.id];
          item.options.forEach(opt=>{
            const b=document.createElement("button");
            b.className="cbtn ";
            if(!currentChoice)b.className+="unset";
            else if(currentChoice===opt.id)b.className+="chosen";
            else b.className+="unchosen";
            b.textContent=opt.label;
            if(!currentChoice||currentChoice===opt.id)b.onclick=()=>makeChoice(item.id,opt.id);
            btns.appendChild(b);
            if(currentChoice===opt.id&&opt.note){
              const n=document.createElement("div");
              n.className="conseq open-tag";
              n.textContent="→ "+opt.note;
              btns.appendChild(n);
            }
          });
          if(currentChoice){
            const reset=document.createElement("button");
            reset.className="cbtn unset";reset.style.fontSize="10px";reset.style.opacity="0.6";
            reset.textContent="↺ undo";
            reset.onclick=()=>makeChoice(item.id,choicesMap[item.id]);
            btns.appendChild(reset);
          }
          row.appendChild(lbl);row.appendChild(q);row.appendChild(btns);
          sd.appendChild(row);
        } else {
          // normal item
          const dn=!!ch[item.id];
          const row=document.createElement("div");row.className="irow"+(dn?" done":"");
          row.onclick=()=>toggleItem(item.id);
          row.innerHTML=`<div class="icb${dn?" done":""}" style="${dn?"border-color:"+g.accent+";background:"+g.accent+"44":""}"> ${dn?`<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3 5.5L8 1" stroke="${g.accent}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</div><span class="itxt${dn?" done":""}">${item.text}</span>`;
          sd.appendChild(row);
        }
      });
      wrap.appendChild(sd);
    }
    c.appendChild(wrap);
  });
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────────
function exportBackup(){
  try{
    const data=JSON.stringify(ST,null,2);
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const filename="fromsoft-progress.json";
    // Try Web Share API (iOS Share Sheet → Save to Files → iCloud)
    if(navigator.share && navigator.canShare && navigator.canShare({files:[new File([blob],filename,{type:"application/json"})]})){
      navigator.share({
        files:[new File([blob],filename,{type:"application/json"})],
        title:"FromSoft Checklist Backup",
      }).catch(e=>console.log("Share cancelled",e));
    } else {
      // Fallback: normal download link
      const a=document.createElement("a");
      a.href=url;a.download=filename;a.click();
      URL.revokeObjectURL(url);
    }
  }catch(e){alert("Export failed: "+e);}
}

function importBackup(){
  const input=document.createElement("input");
  input.type="file";input.accept=".json,application/json";
  input.onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const parsed=JSON.parse(ev.target.result);
        if(!parsed.playthroughs||!parsed.activePerGame)throw new Error("Invalid backup file");
        if(!confirm("This will replace ALL current progress with the backup. Continue?"))return;
        ST=parsed;
        save();
        render();
        alert("Backup restored successfully!");
      }catch(e){alert("Import failed — invalid file.\n"+e);}
    };
    reader.readAsText(file);
  };
  input.click();
}

{id:"ds2_024",text:"Talk to Licia of Lindeldt — she opens the Huntsman's Copse path for 2,000 souls each time"},
{id:"ds2_025",text:"Enter Cathedral of Blue — Blue Sentinel covenant"},
{id:"ds2_c01",type:"choice",question:"What do you do with Licia of Lindeldt?",options:[
{id:"ds2_c01_pay",label:"Pay her 2,000 souls each time",note:"She stays friendly and sells Miracles throughout the game",opens:[],closes:[]},
{id:"ds2_c01_kill",label:"Kill her for the Rotunda Lockstone",note:"You can move the path yourself permanently, but she is dead and no longer sells Miracles",opens:[],closes:[]},
]},
{id:"ds2_026",text:"Enter No-man's Wharf — dark docks full of hollow pirates"},
{id:"ds2_027",text:"Find and ring the ship bell to lower the gangplank"},
{id:"ds2_028",text:"Find Lucatiel of Mirrah in the wharf — first encounter, questline starts"},
{id:"ds2_029",text:"Defeat Flexile Sentry on the ship"},
{id:"ds2_030",text:"Sail to Lost Bastille"},
]},
{id:"ds2_bastille",title:"Lost Bastille & Sinner's Rise",type:"main",requires:["ds2_heide"],items:[
{id:"ds2_031",text:"Light McDuff's Workshop bonfire — McDuff the blacksmith is here"},
{id:"ds2_032",text:"Find the Dull Ember in Lost Bastille — give to McDuff to unlock weapon infusions"},
{id:"ds2_033",text:"Find Lucatiel of Mirrah in Lost Bastille — second encounter"},
{id:"ds2_034",text:"Defeat Belfry Gargoyles in Belfry Luna (optional — Bell Keeper covenant)"},
{id:"ds2_035",text:"Defeat Ruin Sentinels — fight them one at a time on the platform above"},
{id:"ds2_036",text:"Find Estus Flask Shard #2 in a chest"},
{id:"ds2_037",text:"Enter Sinner's Rise — flooded descending tower"},
{id:"ds2_038",text:"Lower the water using the two levers"},
{id:"ds2_039",text:"Defeat Lost Sinner — first of the four Old Ones; two pyromancers light the room on fire in NG+"},
]},
{id:"ds2_hunts",title:"Huntsman's Copse & Harvest Valley",type:"main",requires:["ds2_majula"],items:[
{id:"ds2_040",text:"Enter via Licia's rotating tower from Heide's"},
{id:"ds2_041",text:"Light Undead Refuge bonfire"},
{id:"ds2_042",text:"Free Creighton the Wanderer from prison — Pate & Creighton questline continues"},
{id:"ds2_043",text:"Defeat Skeleton Lords — three bosses that split into smaller skeletons on death"},
{id:"ds2_044",text:"Enter Harvest Valley through the Skeleton Lords boss room"},
{id:"ds2_045",text:"Burn the windmill at the top of Earthen Peak — drains poison from the boss room below"},
{id:"ds2_046",text:"Find Estus Flask Shard #3 in Harvest Valley"},
{id:"ds2_047",text:"Defeat Covetous Demon"},
{id:"ds2_048",text:"Defeat Mytha, the Baneful Queen (drain the poison first by burning the windmill above)"},
]},
{id:"ds2_iron_keep",title:"Iron Keep",type:"main",requires:["ds2_hunts"],items:[
{id:"ds2_049",text:"Descend from Earthen Peak into Iron Keep"},
{id:"ds2_050",text:"Light Ironhearth Hall bonfire"},
{id:"ds2_051",text:"Find Lucatiel of Mirrah in Iron Keep — third encounter, summon her for the boss"},
{id:"ds2_052",text:"Find Estus Flask Shard #4"},
{id:"ds2_053",text:"Defeat Smelter Demon — bring fire resistance, very tanky"},
{id:"ds2_054",text:"Defeat Old Iron King — lava arena, don't fall in"},
{id:"ds2_055",text:"Optional (Iron Passage): Defeat Blue Smelter Demon — magic damage version, harder"},
]},
{id:"ds2_shaded",title:"Shaded Woods & Brightstone Cove",type:"main",requires:["ds2_forest"],items:[
{id:"ds2_056",text:"Unpetrify Rosabeth of Melfia blocking the path with a Fragrant Branch of Yore"},
{id:"ds2_057",text:"Light Ruined Fork Road bonfire — three paths diverge here"},
{id:"ds2_058",text:"Left path (foggy woods): navigate invisible hollow enemies → Scorpioness Najka"},
{id:"ds2_059",text:"Defeat Scorpioness Najka"},
{id:"ds2_060",text:"Enter Doors of Pharros (Rat King covenant) → Defeat Royal Rat Authority"},
{id:"ds2_061",text:"Right path from fork: leads to Aldia's Keep"},
{id:"ds2_062",text:"Light Brightstone Cove Tseldora bonfire"},
{id:"ds2_c02",type:"choice",question:"Pate & Creighton confrontation in Brightstone Cove — who do you side with?",options:[
{id:"ds2_c02_pate",label:"Side with Pate (kill Creighton)",note:"Pate gives you his armor set as thanks. Creighton is dead.",opens:[],closes:[]},
{id:"ds2_c02_creighton",label:"Side with Creighton (kill Pate)",note:"Creighton gives you Pate's Set. Pate is dead.",opens:[],closes:[]},
{id:"ds2_c02_watch",label:"Let them fight / don't interfere",note:"One of them dies on their own. Loot the survivor afterward.",opens:[],closes:[]},
]},
{id:"ds2_063",text:"Defeat Duke's Dear Freja — giant spider boss"},
]},
{id:"ds2_drangleic",title:"Drangleic Castle",type:"main",requires:["ds2_shaded","ds2_bastille","ds2_iron_keep"],items:[
{id:"ds2_064",text:"Approach the castle gate — opens when you have enough Old One souls"},
{id:"ds2_065",text:"Light King's Gate bonfire"},
{id:"ds2_066",text:"Stone Soldiers animate when you enter each room — be ready"},
{id:"ds2_067",text:"Activate the 4 Guardian Dragon statues to unlock inner doors"},
{id:"ds2_068",text:"Defeat Twin Dragonriders — both fight at once"},
{id:"ds2_069",text:"Defeat Looking Glass Knight — can summon players or NPC phantoms from the mirror"},
]},
{id:"ds2_shrine",title:"Shrine of Amana & Undead Crypt",type:"main",requires:["ds2_drangleic"],items:[
{id:"ds2_070",text:"Light Offerings Road bonfire"},
{id:"ds2_071",text:"Navigate Shrine of Amana — go slowly, ranged Milfanito healers shoot from range"},
{id:"ds2_072",text:"Find Lucatiel of Mirrah — fourth encounter, summon her for Demon of Song"},
{id:"ds2_073",text:"Talk to the Milfanito singers in the shrine"},
{id:"ds2_074",text:"Defeat Demon of Song — frog-like boss, hides behind its own hands"},
{id:"ds2_075",text:"Light Undead Ditch bonfire"},
{id:"ds2_076",text:"Enter Undead Crypt — using light alerts enemies"},
{id:"ds2_077",text:"Defeat Velstadt, the Royal Aegis — bell-ringing knight"},
{id:"ds2_078",text:"Enter the inner chamber — King Vendrick walks in circles, hollow and unaggressive"},
{id:"ds2_c03",type:"choice",question:"Do you fight King Vendrick?",options:[
{id:"ds2_c03_fight",label:"Fight Vendrick (collect 4 Giant Souls first)",note:"Each Giant Soul reduces his defense. Without them he has 32× normal defense. Drops Vendrick's soul and the King's Ring",opens:[],closes:[]},
{id:"ds2_c03_skip",label:"Skip Vendrick for now",note:"You can return later. His soul is needed for true ending if you have all 3 DLC crowns",opens:[],closes:[]},
]},
]},
{id:"ds2_memories",title:"Giant Memories & Ancient Dragon",type:"optional",requires:["ds2_drangleic"],items:[
{id:"ds2_079",text:"Obtain the Ashen Mist Heart — talk to the Ancient Dragon on Dragon Shrine (peaceful) or fight it"},
{id:"ds2_080",text:"Enter Memory of Jeigh (via the fallen giant in Forest of Fallen Giants) — defeat Giant Lord"},
{id:"ds2_081",text:"Giant Lord drops the Giant's Kinship — needed to access Throne of Want"},
{id:"ds2_082",text:"Enter Memory of Orro (via giant in Forest of Fallen Giants)"},
{id:"ds2_083",text:"Enter Memory of Vammar (via giant in Forest of Fallen Giants)"},
{id:"ds2_084",text:"Collect 4 Giant Souls total (memories + Ancient Dragon + Shrine of Amana giant) for Vendrick fight"},
]},
{id:"ds2_dlc1",title:"DLC: Crown of the Sunken King",type:"optional",items:[
{id:"ds2_085",text:"Enter Shulva, Sanctum City"},
{id:"ds2_086",text:"Navigate the elevator and lever puzzle to reveal the city below"},
{id:"ds2_087",text:"Defeat Elana, the Squalid Queen — she summons Velstadt and skeletons"},
{id:"ds2_088",text:"Defeat Sinh, the Slumbering Dragon — fast and agile dragon"},
{id:"ds2_089",text:"Collect Crown of the Sunken King"},
]},
{id:"ds2_dlc2",title:"DLC: Crown of the Old Iron King",type:"optional",items:[
{id:"ds2_090",text:"Enter Brume Tower"},
{id:"ds2_091",text:"Navigate the tower using ashen idols and elevators"},
{id:"ds2_092",text:"Defeat Fume Knight (Raime) — one of the hardest bosses in the series"},
{id:"ds2_093",text:"Defeat Sir Alonne — in the Memory of the Old Iron King, an extremely fast katana boss"},
{id:"ds2_094",text:"Defeat Blue Smelter Demon (Iron Passage)"},
{id:"ds2_095",text:"Collect Crown of the Old Iron King"},
]},
{id:"ds2_dlc3",title:"DLC: Crown of the Ivory King",type:"optional",items:[
{id:"ds2_096",text:"Enter Frozen Eleum Loyce"},
{id:"ds2_097",text:"Find and free all 4 Loyce Knights trapped around the city — they fight for you in the final boss"},
{id:"ds2_098",text:"Defeat Aava, the King's Pet — use the Frozen Flower to make the invisible tiger visible"},
{id:"ds2_099",text:"Open the city gates using the mechanisms"},
{id:"ds2_100",text:"Defeat Burnt Ivory King — Loyce knights handle the charred soldiers so you fight 1v1"},
{id:"ds2_101",text:"Collect Crown of the Ivory King"},
]},
{id:"ds2_endgame",title:"Throne of Want — Endgame",type:"main",requires:["ds2_shrine"],items:[
{id:"ds2_102",text:"Enter the Throne of Want with the Giant's Kinship"},
{id:"ds2_103",text:"Defeat Throne Watcher & Throne Defender — they revive each other, kill them close together"},
{id:"ds2_104",text:"Defeat Nashandra — corrupted by Manus's dark soul fragment"},
{id:"ds2_c04",type:"choice",question:"True ending — do you have all 3 DLC crowns and talked to Vendrick?",options:[
{id:"ds2_c04_true",label:"Yes — fight Aldia, Scholar of the First Sin",note:"Aldia appears after Nashandra. Talk to him 3 times without fighting for the 'refuse' dialogue, or fight him",opens:["ds2_aldia"],closes:[]},
{id:"ds2_c04_normal",label:"No — standard ending",note:"Choose to Link the Flame or walk away",opens:[],closes:["ds2_aldia"]},
]},
]},
{id:"ds2_aldia",title:"Aldia, Scholar of the First Sin",type:"optional",items:[
{id:"ds2_105",text:"Aldia appears after Nashandra — he is half-tree, half-flame"},
{id:"ds2_c05",type:"choice",question:"How do you handle Aldia?",options:[
{id:"ds2_c05_fight",label:"Fight Aldia",note:"He cannot truly be killed. After defeating him: choose Link the Flame or walk away",opens:[],closes:[]},
{id:"ds2_c05_talk",label:"Talk to him 3 times without fighting",note:"He gives you a different philosophical ending dialogue. Then choose your ending",opens:[],closes:[]},
]},
{id:"ds2_106",text:"Choose your ending: Link the Flame OR Refuse (walk away into the dark)"},
]},
{id:"ds2_lucatiel",title:"Lucatiel of Mirrah Questline",type:"missable",items:[
{id:"ds2_107",text:"Meet Lucatiel in No-man's Wharf — first encounter"},
{id:"ds2_108",text:"Meet her in Lost Bastille — second encounter, talk to her"},
{id:"ds2_109",text:"Meet her in Iron Keep — third encounter, summon her for Old Iron King and keep her alive"},
{id:"ds2_110",text:"Meet her in Shrine of Amana — fourth encounter, summon her for Demon of Song and keep her alive"},
{id:"ds2_111",text:"After completing all encounters: she gives you her armor set (Lucatiel's Set) and the gesture 'Lucatiel'"},
{id:"ds2_112",text:"She must survive at least 3 of the 4 boss fights to complete the questline"},
]},
{id:"ds2_upgrades",title:"Upgrades & Collectibles",type:"missable",items:[
{id:"ds2_113",text:"Estus Flask Shards (12 total — max +12): Forest ×1, Bastille ×1, Iron Keep ×1, Harvest Valley ×1, Shaded Woods ×1, Shrine of Amana ×1, Drangleic Castle ×1, and more in DLCs"},
{id:"ds2_114",text:"Sublime Bone Dust (5 total — upgrades Estus quality each time): hidden in bonfires and secret areas"},
{id:"ds2_115",text:"Fragrant Branch of Yore: used to unpetrify statues — use wisely, limited early game"},
{id:"ds2_116",text:"Dull Ember: give to McDuff in Lost Bastille — unlocks weapon infusions"},
{id:"ds2_117",text:"Titanite Slabs: trade with Straid of Olaphis, Dyna & Tillo (give Smooth & Silky Stones), rare drops from Pursuer"},
{id:"ds2_118",text:"Boss soul weapons: trade boss souls with Straid of Olaphis or Ornifex for unique weapons"},
]},
]},
{id:"ds3",label:"Dark Souls III",shortLabel:"DS3",accent:"#a07850",bg:"#09080a",sections:[
{id:"ds3_cemetery",title:"Cemetery of Ash & Firelink Shrine",type:"main",items:[
{id:"ds3_001",text:"Wake up in Cemetery of Ash — pick up the Ashen Estus Flask from the chest"},
{id:"ds3_002",text:"Defeat Iudex Gundyr — transforms into a serpent mid-fight"},
{id:"ds3_003",text:"Arrive at Firelink Shrine — light the bonfire"},
{id:"ds3_004",text:"Talk to the Fire Keeper — she upgrades Estus"},
{id:"ds3_005",text:"Talk to Hawkwood the Deserter — gives Ashen Estus Flask and Collapse gesture"},
{id:"ds3_006",text:"Talk to Ludleth of Courland on his throne — he transposes boss souls into weapons/rings"},
{id:"ds3_007",text:"Buy the Tower Key from Shrine Handmaiden (20,000 souls) — access the roof, crow nest, Pickle Pee trades"},
{id:"ds3_008",text:"Find the Coiled Sword Fragment on the roof tower — infinite homeward bone equivalent"},
{id:"ds3_009",text:"Talk to Yoel of Londor near Halfway Fortress bonfire — he offers to draw out your true strength (free levels)"},
]},
{id:"ds3_yoel",title:"Yoel & Yuria Questline",type:"missable",requires:["ds3_cemetery"],items:[
{id:"ds3_c01",type:"choice",question:"Do you take Yoel's free levels (draws out your true strength)?",options:[
{id:"ds3_c01_yes",label:"Yes — take all 5 free levels from Yoel",note:"You gain 5 Dark Sigils. Yuria of Londor appears in Firelink after the 5th level. Required for Usurpation of Fire ending",opens:["ds3_yuria"],closes:[]},
{id:"ds3_c01_no",label:"No — ignore Yoel",note:"Yoel dies after Abyss Watchers. Yuria never appears. Usurpation ending is impossible this playthrough",opens:[],closes:["ds3_yuria"]},
]},
{id:"ds3_010",text:"WARNING: Yoel dies after you defeat the Abyss Watchers if you haven't taken all 5 levels — do this early"},
]},
{id:"ds3_yuria",title:"Yuria of Londor Questline",type:"missable",items:[
{id:"ds3_011",text:"Yuria appears in Firelink after Yoel gives you the 5th Dark Sigil"},
{id:"ds3_012",text:"Talk to Yuria — she is Yoel's superior, a Sable Church agent"},
{id:"ds3_013",text:"Complete Anri of Astoria's questline for the secret wedding (see Anri section)"},
{id:"ds3_014",text:"Don't cure your Dark Sigils (don't give the Fire Keeper the Eyes of a Fire Keeper while Yuria is alive)"},
{id:"ds3_015",text:"At the end: Yuria gives you the Hollow Gem and the Pale Shade of Londor summon"},
]},
{id:"ds3_high_wall",title:"High Wall of Lothric",type:"main",requires:["ds3_cemetery"],items:[
{id:"ds3_016",text:"Light High Wall of Lothric bonfire"},
{id:"ds3_017",text:"Find Greirat of the Undead Settlement in a cell — give him the Blue Tearstone Ring from a nearby corpse"},
{id:"ds3_018",text:"Find Estus Shard #1 on the rooftop near the first bonfire"},
{id:"ds3_019",text:"Find Loretta's Bone on a corpse — give to Greirat to send him on his first scavenge run"},
{id:"ds3_020",text:"Defeat the Pus of Man enemies on the rooftop (transform when aggroed)"},
{id:"ds3_021",text:"Defeat Vordt of the Boreal Valley — ice lion boss at the main gate"},
{id:"ds3_022",text:"Talk to Emma, High Priestess — she gives you the Small Lothric Banner"},
{id:"ds3_023",text:"Find Leonhard in Firelink after lighting the High Wall bonfire — he gives 5 Cracked Red Eye Orbs"},
]},
{id:"ds3_settlement",title:"Undead Settlement",type:"main",requires:["ds3_high_wall"],items:[
{id:"ds3_024",text:"Light Undead Settlement bonfire"},
{id:"ds3_025",text:"Find Irina of Carim locked in a cell — free her, she moves to Firelink and sells Miracles"},
{id:"ds3_026",text:"Find Cornyx of the Great Swamp in a hanging cage — free him, he moves to Firelink and teaches Pyromancy"},
{id:"ds3_027",text:"Find the Mortician's Ashes — give to Handmaiden to buy the Grave Key (shortcut to Road of Sacrifices)"},
{id:"ds3_028",text:"Find Estus Shard #2 near the burning tree with white-robed enemies"},
{id:"ds3_029",text:"Find Undead Bone Shard #1 near the burning tree"},
{id:"ds3_030",text:"Find Siegward of Catarina in the well outside the settlement — give him Siegbrau (from Patches)"},
{id:"ds3_031",text:"Defeat Curse-Rotted Greatwood — giant spider tree, drops the Transposing Kiln"},
{id:"ds3_c02",type:"choice",question:"What do you do with Irina of Carim?",options:[
{id:"ds3_c02_light",label:"Only give her light Braille Tomes",note:"She stays a maiden and completes her questline peacefully. Gives you a Prayer gesture at the end",opens:[],closes:[]},
{id:"ds3_c02_dark",label:"Give her dark Braille Tomes",note:"She loses her mind — Eygon the knight takes her away. You lose access to her miracles",opens:[],closes:[]},
]},
]},
{id:"ds3_road",title:"Road of Sacrifices & Farron Keep",type:"main",requires:["ds3_settlement"],items:[
{id:"ds3_032",text:"Light Road of Sacrifices bonfire"},
{id:"ds3_033",text:"Find Orbeck of Vinheim in a side cave (need 10 INT to recruit) — he moves to Firelink and sells Sorceries"},
{id:"ds3_034",text:"Find Estus Shard #3 near the Halfway Fortress bonfire"},
{id:"ds3_035",text:"Talk to Anri of Astoria and Horace the Hushed at the Halfway Fortress bonfire"},
{id:"ds3_036",text:"Defeat Crystal Sage — sorcerer boss that teleports around the arena"},
{id:"ds3_037",text:"Light Farron Keep bonfire (large poison swamp area)"},
{id:"ds3_038",text:"Extinguish the 3 flames in Farron Keep swamp to open the boss gate"},
{id:"ds3_039",text:"Find Undead Bone Shard #2 in the Farron Keep swamp"},
{id:"ds3_040",text:"Find Estus Shard #4 in the Farron Keep Perimeter area"},
{id:"ds3_041",text:"Enter Old Wolf of Farron area — Watchdogs of Farron covenant"},
{id:"ds3_042",text:"Defeat Abyss Watchers — wolf knights, one fights the others in the first phase"},
]},
{id:"ds3_cathedral",title:"Cathedral of the Deep",type:"main",requires:["ds3_road"],items:[
{id:"ds3_043",text:"Light Cathedral of the Deep bonfire"},
{id:"ds3_044",text:"Find Siegward of Catarina in the well outside — give him Siegbrau (bought from Patches after his Firelink appearance)"},
{id:"ds3_045",text:"Open the main cathedral front doors — creates a shortcut back to the first bonfire"},
{id:"ds3_046",text:"Find Estus Shard #5 inside the cathedral on an altar"},
{id:"ds3_047",text:"Find Undead Bone Shard #3 behind a giant in the graveyard"},
{id:"ds3_048",text:"Find the Deep Braille Divine Tome (give to Irina for dark miracles — see Irina choice above)"},
{id:"ds3_049",text:"Find Rosaria's Fingers covenant in the cathedral — Rosaria allows respec and appearance change"},
{id:"ds3_c03",type:"choice",question:"Do you join Rosaria's Fingers covenant?",options:[
{id:"ds3_c03_join",label:"Join Rosaria's Fingers",note:"You can respec and change appearance. BUT: offering a Pale Tongue to Rosaria kills Sirris's questline permanently",opens:[],closes:[]},
{id:"ds3_c03_sirris",label:"Don't offer Pale Tongues to Rosaria",note:"Sirris of the Sunless Realms questline stays open — she is a helpful NPC with unique summons",opens:["ds3_sirris"],closes:[]},
]},
{id:"ds3_050",text:"Defeat Deacons of the Deep — find and kill the red-glowing Archdeacon"},
{id:"ds3_051",text:"Receive the Small Doll — key to entering Irithyll"},
]},
{id:"ds3_sirris",title:"Sirris of the Sunless Realms Questline",type:"missable",items:[
{id:"ds3_052",text:"After Cathedral: Sirris appears in Firelink and swears her service to you"},
{id:"ds3_053",text:"Her summon sign appears at multiple bosses — she helps you fight invading NPC phantoms"},
{id:"ds3_054",text:"After Irithyll: she asks you to help her fight an invader in the Undead Settlement area"},
{id:"ds3_055",text:"After defeating the invader: she moves to her grandmother's grave in the Pit of Hollows"},
{id:"ds3_056",text:"Visit her grave — she leaves you her armor set and the Sunset Shield"},
]},
{id:"ds3_catacombs",title:"Catacombs of Carthus & Smouldering Lake",type:"main",requires:["ds3_road"],items:[
{id:"ds3_057",text:"Light Catacombs of Carthus bonfire"},
{id:"ds3_058",text:"Find Anri of Astoria in the catacombs — second encounter"},
{id:"ds3_c04",type:"choice",question:"What do you do about Horace the Hushed (Anri's companion)?",options:[
{id:"ds3_c04_tell",label:"Tell Anri where Horace is",note:"Anri goes to find Horace. Horace has gone hollow and Anri must kill him — this saddens Anri and affects their quest",opens:[],closes:[]},
{id:"ds3_c04_silent",label:"Say nothing / kill Horace yourself first",note:"Horace dies without Anri knowing. Anri's questline continues more smoothly toward the secret ending",opens:[],closes:[]},
]},
{id:"ds3_059",text:"Cut the rope bridge in the catacombs — it falls and becomes a ladder down"},
{id:"ds3_060",text:"Find Undead Bone Shard #4 in the catacombs"},
{id:"ds3_061",text:"Defeat High Lord Wolnir — giant skeleton boss, destroy his three golden bracelets"},
{id:"ds3_062",text:"Enter Smouldering Lake: shoot the giant ballista's rope OR fall from the rope bridge"},
{id:"ds3_063",text:"Defeat Old Demon King in Smouldering Lake (optional)"},
{id:"ds3_064",text:"Find Undead Bone Shard #5 in Smouldering Lake"},
{id:"ds3_065",text:"Find the Large Ember in Smouldering Lake — gives Andre the ability to do higher infusions"},
]},
{id:"ds3_irithyll",title:"Irithyll of the Boreal Valley",type:"main",requires:["ds3_cathedral","ds3_catacombs"],items:[
{id:"ds3_066",text:"Use the Small Doll to pass through the invisible barrier into Irithyll"},
{id:"ds3_067",text:"Light Irithyll of the Boreal Valley bonfire"},
{id:"ds3_068",text:"Find Siegward of Catarina in the kitchen of Irithyll — give him Siegbrau and talk"},
{id:"ds3_069",text:"Find Anri of Astoria on the long bridge — third encounter"},
{id:"ds3_c05",type:"choice",question:"Anri's questline — the secret wedding path or the straight sword path?",options:[
{id:"ds3_c05_wedding",label:"Secret wedding path (Usurpation ending)",note:"Find and kill the assassin hiding as a statue in Church of Yorshka. Anri is then led to Anor Londo for a secret wedding ceremony. Required for Usurpation of Fire ending (also need Yuria's questline)",opens:["ds3_usurpation"],closes:[]},
{id:"ds3_c05_sword",label:"Let Anri's normal quest play out",note:"Anri continues to fight Aldrich. After Aldrich dies: find Anri's grave in the catacombs for Anri's Straight Sword",opens:[],closes:["ds3_usurpation"]},
]},
{id:"ds3_070",text:"Find Estus Shard #6 in a chest in the residential area"},
{id:"ds3_071",text:"Find Undead Bone Shard #6 on a ledge near the Church of Yorshka"},
{id:"ds3_072",text:"Light Church of Yorshka bonfire"},
{id:"ds3_073",text:"Defeat Pontiff Sulyvahn — dual-blade boss, one of the most aggressive in the game"},
{id:"ds3_074",text:"Navigate through Anor Londo (revisited) — Aldrich Faithful covenant here"},
{id:"ds3_075",text:"Defeat Aldrich, Devourer of Gods — fights like Gwyndolin, shoots arrow rain from above"},
]},
{id:"ds3_usurpation",title:"Usurpation of Fire — Setup",type:"missable",items:[
{id:"ds3_076",text:"Have 5 Dark Sigils from Yoel AND Yuria alive in Firelink"},
{id:"ds3_077",text:"Kill the assassin disguised as a statue in the Church of Yorshka (Irithyll)"},
{id:"ds3_078",text:"Anri is led to Anor Londo for the wedding — a cut-scene plays in front of the altar"},
{id:"ds3_079",text:"Do NOT cure your Dark Sigils at any point"},
{id:"ds3_080",text:"At the end, after Soul of Cinder: walk away from the bonfire — Yuria appears and congratulates you"},
]},
{id:"ds3_dungeon",title:"Irithyll Dungeon & Profaned Capital",type:"main",requires:["ds3_irithyll"],items:[
{id:"ds3_081",text:"Light Irithyll Dungeon bonfire"},
{id:"ds3_082",text:"Find Siegward of Catarina imprisoned in a cell — you need his armor (bought from Patches) to free him"},
{id:"ds3_083",text:"Find Estus Shard #7 in a chest in the dungeon"},
{id:"ds3_084",text:"Find Karla the Witch in a cell — free her, she moves to Firelink (sells dark sorceries/pyromancies)"},
{id:"ds3_085",text:"WARNING: Do not kill the Giants in the dungeon — they help you in Archdragon Peak"},
{id:"ds3_086",text:"Enter Profaned Capital"},
{id:"ds3_087",text:"Find Undead Bone Shard #7 in Profaned Capital"},
{id:"ds3_088",text:"Defeat Yhorm the Giant — use the Storm Ruler great sword found in the boss room, charge its skill"},
{id:"ds3_089",text:"Siegward appears during the Yhorm fight and helps — his questline ends here, giving you his armor and Siegbrau"},
]},
{id:"ds3_patches",title:"Patches Questline",type:"missable",items:[
{id:"ds3_c06",type:"choice",question:"Patches — how do you handle him in the Cathedral tower?",options:[
{id:"ds3_c06_forgive",label:"Forgive Patches after he kicks you in the pit",note:"He moves to Firelink and sells items including Siegward's armor, Siegbrau, and the Rusted Gold Coin. Essential for Siegward and Greirat questlines",opens:["ds3_greirat"],closes:[]},
{id:"ds3_c06_kill",label:"Kill Patches",note:"You get his armor and a few items, but lose access to his shop. Siegward and Greirat questlines break",opens:[],closes:["ds3_greirat"]},
]},
{id:"ds3_090",text:"Buy Siegward's armor from Patches' shop — needed to free Siegward from the Irithyll Dungeon cell"},
{id:"ds3_091",text:"Buy Siegbrau from Patches — give to Siegward at Cathedral well and Irithyll kitchen"},
]},
{id:"ds3_greirat",title:"Greirat of the Undead Settlement Questline",type:"missable",items:[
{id:"ds3_092",text:"Free Greirat from High Wall cell — give him the Blue Tearstone Ring"},
{id:"ds3_093",text:"Give Greirat Loretta's Bone — he mourns and goes on his first scavenge run to the Undead Settlement"},
{id:"ds3_094",text:"Scavenge run 1 (Undead Settlement): he always returns safely with new stock"},
{id:"ds3_c07",type:"choice",question:"Greirat's 2nd scavenge run (Irithyll) — how do you keep him alive?",options:[
{id:"ds3_c07_siegward",label:"Have Siegward alive and in Irithyll",note:"Siegward saves Greirat. Most natural route if you've followed Siegward's questline",opens:[],closes:[]},
{id:"ds3_c07_patches",label:"Tell Patches to go rescue him",note:"Patches saves Greirat (requires Patches alive and having talked to him about Greirat)",opens:[],closes:[]},
{id:"ds3_c07_fail",label:"Neither — Greirat dies in Irithyll",note:"His ashes appear in Irithyll. Handmaiden can sell his stock if you give her his ashes",opens:[],closes:[]},
]},
{id:"ds3_095",text:"Scavenge run 3 (Lothric Castle): Greirat always dies here — you cannot save him. His ashes appear in Lothric Castle"},
{id:"ds3_096",text:"Give Greirat's Ashes to Handmaiden — she sells his entire stock including rare consumables and a Titanite Slab"},
]},
{id:"ds3_lothric",title:"Lothric Castle & Grand Archives",type:"main",requires:["ds3_dungeon","ds3_irithyll"],items:[
{id:"ds3_097",text:"Light Lothric Castle bonfire"},
{id:"ds3_098",text:"Find Estus Shard #8 on a balcony in Lothric Castle"},
{id:"ds3_099",text:"Find Undead Bone Shard #8 below the first wyvern perch"},
{id:"ds3_100",text:"Defeat Dragonslayer Armour — animated suit of armor on the rooftop bridge"},
{id:"ds3_101",text:"Enter Grand Archives"},
{id:"ds3_102",text:"Dunk your head in the wax pool at the entrance — removes the curse from flying books"},
{id:"ds3_103",text:"Find Estus Shard #9 in Grand Archives"},
{id:"ds3_104",text:"Find Undead Bone Shard #9 in Grand Archives"},
{id:"ds3_105",text:"Defeat three golden-winged knights on the rooftop — hard but drops Titanite Chunks"},
{id:"ds3_106",text:"Defeat Twin Princes — Lorian (melee) and Lothric (magic); Lothric revives Lorian, kill Lothric last"},
]},
{id:"ds3_archdragon",title:"Archdragon Peak",type:"optional",requires:["ds3_dungeon"],items:[
{id:"ds3_107",text:"Find the Path of the Dragon gesture on a corpse in Irithyll Dungeon (near meditating dragon statue)"},
{id:"ds3_108",text:"Use Path of the Dragon gesture while sitting next to the dragon statue — teleported to Archdragon Peak"},
{id:"ds3_109",text:"Light Archdragon Peak bonfire"},
{id:"ds3_110",text:"Defeat Ancient Wyvern — use the shortcut path and plunge attack its head from above"},
{id:"ds3_111",text:"Defeat Nameless King — two phase: King of the Storm (wyvern) then Nameless King himself; optional but one of the hardest bosses in the game"},
{id:"ds3_112",text:"Dragon Communion covenant here — consume dragon hearts for breath spells"},
]},
{id:"ds3_consumed",title:"Consumed King's Garden & Untended Graves",type:"optional",requires:["ds3_lothric"],items:[
{id:"ds3_113",text:"Descend into Consumed King's Garden from Lothric Castle"},
{id:"ds3_114",text:"Defeat Oceiros, the Consumed King — he goes feral in phase 2"},
{id:"ds3_115",text:"Find the secret passage behind Oceiros's arena"},
{id:"ds3_116",text:"Enter the Untended Graves — a dark mirror version of Firelink Shrine"},
{id:"ds3_117",text:"Defeat Champion Gundyr — much harder and more aggressive than the tutorial version"},
{id:"ds3_118",text:"Find the Eyes of a Fire Keeper — required for the Betrayal/End of Fire ending (give to Fire Keeper in Firelink)"},
]},
{id:"ds3_kiln",title:"Kiln of the First Flame",type:"main",requires:["ds3_lothric"],items:[
{id:"ds3_119",text:"Transport all four Lords of Cinder to their thrones in Firelink (Aldrich, Yhorm, Twin Princes, Abyss Watchers)"},
{id:"ds3_120",text:"Emma appears and gives you the Basin of Vows — use it to travel to the Kiln"},
{id:"ds3_121",text:"Defeat Soul of Cinder — two phase: cycles through weapon types, then mimics Gwyn from DS1"},
{id:"ds3_c08",type:"choice",question:"Which ending do you choose?",options:[
{id:"ds3_c08_link",label:"Link the First Flame",note:"Touch the bonfire — sacrifice yourself, extend the Age of Fire",opens:[],closes:[]},
{id:"ds3_c08_hollow",label:"Lord of Hollows (Usurpation of Fire)",note:"Requires: 5 Dark Sigils from Yoel + Yuria alive + Anri's wedding completed. Walk away from the bonfire — Yuria narrates your ascension",opens:[],closes:[]},
{id:"ds3_c08_end",label:"End of Fire (betrayal ending)",note:"Requires: Eyes of a Fire Keeper given to her. Summon Fire Keeper to the bonfire during Soul of Cinder fight. She snuffs the flame — do NOT attack her",opens:[],closes:[]},
]},
]},
{id:"ds3_dlc1",title:"DLC: Ashes of Ariandel",type:"optional",items:[
{id:"ds3_122",text:"Interact with the altar at Cleansing Chapel (Cathedral of the Deep) — meet Slave Knight Gael"},
{id:"ds3_123",text:"Enter the Painted World of Ariandel"},
{id:"ds3_124",text:"Light the Snowfield bonfire"},
{id:"ds3_125",text:"Chop down the great rope bridge with an axe — it falls and becomes a ramp down"},
{id:"ds3_126",text:"Light Ariandel Chapel bonfire"},
{id:"ds3_127",text:"Navigate the basement — Vilhelm NPC invades here"},
{id:"ds3_128",text:"Defeat Champion's Gravetender & Gravetender Greatwolf (optional)"},
{id:"ds3_129",text:"Find Sister Friede in the chapel — talk to her twice before she turns hostile"},
{id:"ds3_130",text:"Defeat Sister Friede & Father Ariandel — three phases: Friede → Ariandel+Friede → Blackflame Friede"},
{id:"ds3_131",text:"Receive Captain's Ashes — give to Handmaiden for new items including the Earth Seeker"},
]},
{id:"ds3_dlc2",title:"DLC: The Ringed City",type:"optional",requires:["ds3_dlc1"],items:[
{id:"ds3_132",text:"Access via Kiln bonfire (after Soul of Cinder) OR via the end of Ashes of Ariandel"},
{id:"ds3_133",text:"Enter the Dreg Heap — the end of the world, all things piled here"},
{id:"ds3_134",text:"Defeat Demon in Pain & Demon from Below, then Demon Prince — three-phase demon fight"},
{id:"ds3_135",text:"Enter the Ringed City"},
{id:"ds3_136",text:"Light Ringed City Streets bonfire"},
{id:"ds3_137",text:"Find Lapp (amnesiac Patches) — help him remember who he is across multiple encounters"},
{id:"ds3_138",text:"Find Shira, Knight of Filianore — she gives a quest to kill Midir and Gael"},
{id:"ds3_139",text:"Defeat Halflight, Spear of the Church — can be a PvP invader or NPC"},
{id:"ds3_140",text:"Enter Filianore's Rest"},
{id:"ds3_141",text:"Defeat Darkeater Midir (optional) — hidden in a pit under the broken bridge; plunge attack his head"},
{id:"ds3_142",text:"Find and defeat Slave Knight Gael — the final boss of the entire Dark Souls trilogy"},
]},
{id:"ds3_upgrades",title:"Upgrades & Collectibles",type:"missable",items:[
{id:"ds3_143",text:"Estus Shards (11 total — max 15 flasks, split freely between Estus and Ashen Estus): High Wall ×1, Settlement ×1, Road of Sacrifices ×1, Cathedral ×1, Farron Keep ×1, Irithyll ×1, Irithyll Dungeon ×1, Lothric Castle ×1, Grand Archives ×1, Consumed King's Garden ×1, Smouldering Lake ×1"},
{id:"ds3_144",text:"Undead Bone Shards (10 total — each upgrades healing per Estus sip): Cemetery ×1, Settlement ×1, Farron Keep ×1, Cathedral ×1, Catacombs ×1, Smouldering Lake ×1, Irithyll ×1, Profaned Capital ×1, Lothric Castle ×1, Grand Archives ×1"},
{id:"ds3_145",text:"Coals for Andre (unlock infusion types): Sage's Coal (Road of Sacrifices), Farron Coal (Farron Keep), Giant's Coal (Anor Londo), Profaned Coal (Profaned Capital)"},
{id:"ds3_146",text:"Titanite Slabs: Stray Demon (Farron area), Siegward questline reward, Twin Princes drop, Greirat 3rd run ashes, rare drops from Crystal Lizards in Grand Archives"},
{id:"ds3_147",text:"Boss soul transposition: give boss souls to Ludleth on his throne — unique weapons and rings"},
]},
]},
{id:"bb",label:"Bloodborne",shortLabel:"BB",accent:"#8c3a2e",bg:"#0d0a0e",sections:[
{id:"bb_clinic",title:"Iosefka's Clinic & Hunter's Dream",type:"main",items:[
{id:"bb_001",text:"Wake up in Iosefka's Clinic — receive the Hunter's Mark"},
{id:"bb_002",text:"Get attacked by the werewolf — first death triggers the Hunter's Dream"},
{id:"bb_003",text:"In the Hunter's Dream: talk to Gehrman, pick up your starting weapons from the workshop"},
{id:"bb_004",text:"Pick starting weapon: Saw Cleaver (best all-round), Hunter Axe (strength), or Threaded Cane (skill)"},
{id:"bb_005",text:"Pick starting gun: Hunter Pistol (fast parry) or Hunter Blunderbuss (wide spread)"},
{id:"bb_006",text:"Return to Iosefka's Clinic — go through the back door into Yharnam"},
{id:"bb_007",text:"Gain 1 Insight (by seeing a boss or using Madman's Knowledge) — the Plain Doll wakes up and can level you"},
]},
{id:"bb_central",title:"Central Yharnam",type:"main",requires:["bb_clinic"],items:[
{id:"bb_008",text:"Light Central Yharnam lamp (shortcut gate near Iosefka's Clinic)"},
{id:"bb_009",text:"Learn to rally — regain HP by hitting enemies immediately after taking damage"},
{id:"bb_010",text:"Find the first window NPC (man with top hat)"},
{id:"bb_c01",type:"choice",question:"Where do you send window NPCs you rescue?",options:[
{id:"bb_c01_cathedral",label:"Send them to Oedon Chapel (Cathedral Ward)",note:"Safer destination — they survive and provide services. Recommended for Arianna and Adella",opens:["bb_oedon_npcs"],closes:[]},
{id:"bb_c01_iosefka",label:"Send them to Iosefka's Clinic",note:"They disappear and are turned into blue elixirs — you gain Insight. Arianna sent here gives no umbilical cord",opens:[],closes:["bb_oedon_npcs"]},
]},
{id:"bb_011",text:"Light Tomb of Oedon lamp"},
{id:"bb_012",text:"Talk to Alfred near the chapel — he tells you about the Healing Church"},
{id:"bb_013",text:"Defeat Cleric Beast on the Oedon Chapel bridge (optional but drops Sword Hunter Badge and gives Insight)"},
{id:"bb_014",text:"Defeat Father Gascoigne — use the music box (from his daughter) to stagger him in phase 1"},
{id:"bb_015",text:"After Gascoigne: check the rooftop house with his daughter — she is looking for her parents"},
{id:"bb_c02",type:"choice",question:"What do you do with Gascoigne's daughter?",options:[
{id:"bb_c02_brooch",label:"Give her the Red Jeweled Brooch (from Gascoigne's wife's corpse)",note:"She jumps to her death looking for her grandmother. Returns the Oedon Writhe rune. Tragic.",opens:[],closes:[]},
{id:"bb_c02_nothing",label:"Tell her to wait / don't give the brooch",note:"She waits. Later she goes looking herself and dies off-screen. No rune.",opens:[],closes:[]},
]},
]},
{id:"bb_oedon_npcs",title:"Oedon Chapel Survivors",type:"optional",items:[
{id:"bb_016",text:"Find Arianna at her door in Cathedral Ward — send her to Oedon Chapel"},
{id:"bb_017",text:"Find Adella the Nun in Hypogean Gaol (Yahar'gul, pre-ROM) — send her to Oedon Chapel"},
{id:"bb_018",text:"Find the Skeptic's Burned Man at his window — send him to Oedon Chapel or clinic"},
{id:"bb_019",text:"Find the Older Brother NPC (Central Yharnam window) — send him to Oedon Chapel"},
{id:"bb_020",text:"After ROM: visit Oedon Chapel — Arianna gives birth to a Great One's child"},
{id:"bb_021",text:"Kill Arianna's child for a Kin Coldblood and a piece of her umbilical cord (Umbilical Cord #2)"},
{id:"bb_022",text:"WARNING: if you use Arianna's blood (her vial) too many times, Adella kills Arianna"},
]},
{id:"bb_cathedral",title:"Cathedral Ward",type:"main",requires:["bb_central"],items:[
{id:"bb_023",text:"Light Cathedral Ward lamp"},
{id:"bb_024",text:"Talk to Eileen the Crow near the Cathedral — Crow Hunter Badge, starts her questline"},
{id:"bb_025",text:"Explore Healing Church Workshop (tower to the right) — good loot, Heir rune at the very top"},
{id:"bb_026",text:"Find the Abandoned Old Workshop at the bottom of the Healing Church tower — Cord of the Eye rune and Umbilical Cord #4"},
{id:"bb_027",text:"Open the shortcut gate near the two giant pigs — connects back to Central Yharnam"},
{id:"bb_028",text:"Defeat Blood-Starved Beast — weak to fire (Molotov Cocktails or Fire Paper), drops Pthumeru Chalice and Hunter Chief Emblem"},
{id:"bb_029",text:"Use Hunter Chief Emblem (10,000 Blood Echoes) to open the Cathedral Ward gate OR find the emblem"},
]},
{id:"bb_eileen",title:"Eileen the Crow Questline",type:"missable",items:[
{id:"bb_030",text:"Meet Eileen in Cathedral Ward — she gives the Shake Off Cape gesture"},
{id:"bb_031",text:"After Father Gascoigne: find Eileen near the Tomb of Oedon lamp — she is hunting Henryk"},
{id:"bb_032",text:"Summon Eileen to help fight Henryk at the Tomb of Oedon lamp (or fight him alone)"},
{id:"bb_c03",type:"choice",question:"Eileen vs Henryk — how does this go?",options:[
{id:"bb_c03_help",label:"Help Eileen fight Henryk (summon her)",note:"Henryk dies, Eileen survives — questline continues toward the Grand Cathedral",opens:["bb_eileen_end"],closes:[]},
{id:"bb_c03_alone",label:"Fight Henryk alone without Eileen",note:"Henryk dies, Eileen survives and is impressed — questline continues",opens:["bb_eileen_end"],closes:[]},
{id:"bb_c03_fail",label:"Eileen dies to Henryk",note:"Questline ends here — no further reward",opens:[],closes:["bb_eileen_end"]},
]},
]},
{id:"bb_eileen_end",title:"Eileen — Grand Cathedral Conclusion",type:"missable",items:[
{id:"bb_033",text:"Before killing Vicar Amelia: find Eileen wounded near the Grand Cathedral entrance"},
{id:"bb_034",text:"Help Eileen fight the NPC hunter attacking her (or she dies)"},
{id:"bb_035",text:"After the fight: talk to Eileen inside the Grand Cathedral — she gives you the Crow Hunter Badge"},
{id:"bb_036",text:"If Eileen dies here: loot her corpse for the badge"},
]},
{id:"bb_old_yharnam",title:"Old Yharnam",type:"optional",requires:["bb_cathedral"],items:[
{id:"bb_037",text:"Descend into Old Yharnam — quarantined by the Healing Church"},
{id:"bb_c04",type:"choice",question:"How do you handle Djura on the gatling gun tower?",options:[
{id:"bb_c04_peaceful",label:"Reach the rooftops without attacking beasts",note:"Djura stands down and gives you the Powder Keg Hunter Badge peacefully. He becomes a friendly NPC.",opens:[],closes:[]},
{id:"bb_c04_kill",label:"Kill Djura and his ally",note:"Same badge as a drop. No friendly NPC.",opens:[],closes:[]},
]},
{id:"bb_038",text:"Light Graveyard of the Darkbeast lamp"},
{id:"bb_039",text:"Defeat Darkbeast Paarl (optional) — opens a shortcut gate to Yahar'gul from Cathedral Ward"},
{id:"bb_040",text:"Find the Rifle Spear and other unique trick weapons in Old Yharnam"},
]},
{id:"bb_hemwick",title:"Hemwick Charnel Lane & Vicar Amelia",type:"main",requires:["bb_cathedral"],items:[
{id:"bb_041",text:"Travel through Cathedral Ward upper area to reach Hemwick Charnel Lane"},
{id:"bb_042",text:"Light Hemwick Charnel Lane lamp"},
{id:"bb_043",text:"Defeat Witch of Hemwick — find and kill the two hidden witches among the summoned enemies"},
{id:"bb_044",text:"Unlock the Rune Workshop Tool — allows equipping Caryll Runes (found in Witch of Hemwick area)"},
{id:"bb_045",text:"Defeat Vicar Amelia in the Grand Cathedral — armored wolf boss, use Bolt Paper or Fire Paper"},
{id:"bb_046",text:"Interact with the altar after Amelia — watch the password cutscene, triggers night cycle"},
{id:"bb_047",text:"The world changes: blood moon effects begin, new NPCs become accessible or hostile"},
]},
{id:"bb_forbidden",title:"Forbidden Woods",type:"main",requires:["bb_hemwick"],items:[
{id:"bb_048",text:"Use the Lunarium Key from the altar area to open the path to Forbidden Woods"},
{id:"bb_049",text:"Light Forbidden Woods lamp"},
{id:"bb_050",text:"Navigate the village — snake ball enemies, fire is very effective"},
{id:"bb_051",text:"Find the secret back path to Iosefka's Clinic — Cainhurst Summons is here"},
{id:"bb_c05",type:"choice",question:"Do you enter Iosefka's Clinic back door?",options:[
{id:"bb_c05_enter",label:"Enter the clinic back area",note:"Collect the Cainhurst Summons (needed for Cainhurst Castle). You can also send NPCs here for Insight — they are transformed into blue elixirs",opens:["bb_cainhurst"],closes:[]},
{id:"bb_c05_skip",label:"Skip the clinic back area",note:"No Cainhurst this playthrough unless you find another way (there is no other way — Cainhurst requires the Summons)",opens:[],closes:["bb_cainhurst"]},
]},
{id:"bb_052",text:"Defeat Shadows of Yharnam — three-boss fight at the end of the woods"},
]},
{id:"bb_byrgenwerth",title:"Byrgenwerth",type:"main",requires:["bb_forbidden"],items:[
{id:"bb_053",text:"Light Byrgenwerth lamp"},
{id:"bb_054",text:"Talk to Master Willem on the balcony — he points to the lake"},
{id:"bb_055",text:"Find the Eye Rune in the lecture building"},
{id:"bb_056",text:"Descend to the lake — ROM is in the water"},
{id:"bb_057",text:"Defeat ROM, the Vacuous Spider — kill the small spiders or focus ROM; she teleports"},
{id:"bb_058",text:"ROM's death triggers the blood moon — the world changes permanently"},
]},
{id:"bb_yaharghul",title:"Yahar'gul, Unseen Village",type:"main",requires:["bb_byrgenwerth"],items:[
{id:"bb_059",text:"Optional pre-ROM: get captured by a Snatcher (one-shot enemy in Cathedral Ward) — wakes in Hypogean Gaol, find Adella and a lamp"},
{id:"bb_060",text:"Post-ROM: enter Yahar'gul via Cathedral Ward shortcut (if Paarl was killed) or the main path"},
{id:"bb_061",text:"Light Yahar'gul Chapel lamp"},
{id:"bb_062",text:"Kill the bell-ringing witches on the balconies first — they cause enemies to respawn infinitely"},
{id:"bb_063",text:"Find the Eye Pendant in Yahar'gul — opens one of the Brain of Mensis mechanisms later"},
{id:"bb_064",text:"Defeat The One Reborn — large mass of bodies, kill the balcony witches first"},
]},
{id:"bb_cainhurst",title:"Forsaken Castle Cainhurst",type:"optional",items:[
{id:"bb_065",text:"Have the Cainhurst Summons from Iosefka's Clinic back door"},
{id:"bb_066",text:"Use the summons at the Hemwick Charnel Lane area — a carriage arrives at night"},
{id:"bb_067",text:"Light Forsaken Castle Cainhurst lamp"},
{id:"bb_068",text:"Navigate the castle — frozen undead and Cainhurst Knights"},
{id:"bb_069",text:"Defeat Martyr Logarius — bait his skull storm then attack; tricky ranged scythe boss"},
{id:"bb_070",text:"Receive the Crown of Illusions — wear it near the throne to reveal Annalise, Queen of the Vilebloods"},
{id:"bb_c06",type:"choice",question:"What do you do with Annalise and Alfred?",options:[
{id:"bb_c06_vileblood",label:"Join the Vilebloods covenant",note:"Annalise stays alive. Alfred will come later and kill her (if his questline is active).",opens:["bb_alfred"],closes:[]},
{id:"bb_c06_alfred",label:"Give Alfred the Unopened Summons (from Cainhurst)",note:"Alfred uses it to find and kill Annalise. He dies happy. You receive the Wheel Hunter Badge.",opens:["bb_alfred"],closes:[]},
{id:"bb_c06_ignore",label:"Leave without joining or giving Alfred anything",note:"Annalise stays alive, Alfred's questline doesn't progress to conclusion.",opens:[],closes:[]},
]},
]},
{id:"bb_alfred",title:"Alfred Questline",type:"missable",items:[
{id:"bb_071",text:"Meet Alfred near the Cathedral Ward — he is hunting the Vilebloods"},
{id:"bb_072",text:"Give Alfred the Unopened Summons from Cainhurst — he rushes there"},
{id:"bb_073",text:"Find Alfred at Cainhurst after he kills Annalise — he gives you the Wheel Hunter Badge"},
{id:"bb_074",text:"Find Alfred dying nearby — exhaust his dialogue"},
{id:"bb_075",text:"Optional: give Alfred absolution at the Fountain in Cathedral Ward to revive Annalise"},
]},
{id:"bb_frontier",title:"Nightmare Frontier",type:"optional",requires:["bb_cathedral"],items:[
{id:"bb_076",text:"Get grabbed by an Amygdala on the path after Cathedral Ward (post-blood moon) or find the shortcut lamp"},
{id:"bb_077",text:"Light Nightmare Frontier lamp"},
{id:"bb_078",text:"Navigate the poison lake — equip the Iosefka's Blood Vial for anti-toxin"},
{id:"bb_079",text:"Find the Lecture Building Key — opens the main Lecture Building entrance"},
{id:"bb_080",text:"Defeat Amygdala — target its arms and head with bolt or fire"},
{id:"bb_081",text:"Receive the Ailing Loran Chalice"},
]},
{id:"bb_mensis",title:"Nightmare of Mensis",type:"main",requires:["bb_yaharghul"],items:[
{id:"bb_082",text:"Enter the Lecture Building (1F) — navigate the student-filled halls"},
{id:"bb_083",text:"Light Lecture Building 1F lamp"},
{id:"bb_084",text:"Enter Lecture Building 2F — another lamp"},
{id:"bb_085",text:"Enter Nightmare of Mensis from the 2F door"},
{id:"bb_086",text:"Light Mergo's Loft lamp"},
{id:"bb_087",text:"The giant Brain of Mensis kills you with its gaze — equip the Mensis Cage to lure it out, or use Bold Hunter's Mark to escape"},
{id:"bb_088",text:"Shoot the chain holding the brain — it falls into the pit and becomes harmless, rewards the Moon rune"},
{id:"bb_089",text:"Defeat Micolash, Host of the Nightmare — chase him through the two cages, he uses A Call Beyond"},
{id:"bb_090",text:"Defeat Mergo's Wet Nurse — large shadow boss with multiple scythes"},
{id:"bb_091",text:"Receive Mergo's Umbilical Cord (Umbilical Cord #1)"},
]},
{id:"bb_umbilical",title:"Umbilical Cords — True Ending Prep",type:"missable",items:[
{id:"bb_092",text:"Umbilical Cord #1: dropped by Mergo's Wet Nurse"},
{id:"bb_093",text:"Umbilical Cord #2: dropped by Arianna's stillborn child (Oedon Chapel, post-ROM) — requires sending Arianna to Cathedral Ward"},
{id:"bb_094",text:"Umbilical Cord #3: found in the Abandoned Old Workshop chest (bottom of Healing Church tower)"},
{id:"bb_095",text:"Umbilical Cord #4: dropped by Iosefka herself — kill her after the blood moon (back door of clinic)"},
{id:"bb_096",text:"You only need 3 of the 4 cords — consume them before fighting Gehrman for the true ending"},
]},
{id:"bb_endgame",title:"Hunter's Dream — Endgame",type:"main",requires:["bb_mensis"],items:[
{id:"bb_097",text:"Return to Hunter's Dream — it is on fire, Gehrman sits in his chair"},
{id:"bb_098",text:"Talk to Gehrman — he offers to free you from the dream"},
{id:"bb_c07",type:"choice",question:"Which ending do you choose?",options:[
{id:"bb_c07_submit",label:"Ending 1 — Yharnam Sunrise (submit to Gehrman)",note:"Let Gehrman kill you — wake up in the real world as a normal person. The dream ends.",opens:[],closes:[]},
{id:"bb_c07_refuse",label:"Ending 2 — Honoring Wishes (refuse Gehrman)",note:"Fight Gehrman. After winning, the Moon Presence descends — you submit to it and become the next dreamer.",opens:[],closes:[]},
{id:"bb_c07_true",label:"Ending 3 — Childhood's Beginning (true ending)",note:"Requires consuming 3+ Umbilical Cords before this fight. Fight Gehrman, then resist the Moon Presence — you become a Great One infant.",opens:[],closes:[]},
]},
]},
{id:"bb_dlc",title:"DLC: The Old Hunters",type:"optional",items:[
{id:"bb_099",text:"After blood moon: find the Madman near Cathedral Ward — he gives you the Eye of a Blood-Drunk Hunter"},
{id:"bb_100",text:"An Amygdala grabs you and takes you to Hunter's Nightmare"},
{id:"bb_101",text:"Light Hunter's Nightmare lamp"},
{id:"bb_102",text:"Navigate the bloody flooded version of Central Yharnam"},
{id:"bb_103",text:"Find Simon the Harrowed — he is searching for the Holy Moonlight Sword"},
{id:"bb_104",text:"Find Ludwig's skull — show it to Ludwig after the boss fight for a peaceful death scene (and the Holy Moonlight Sword)"},
{id:"bb_105",text:"Defeat Ludwig, the Accursed / Holy Blade — phase 1: beast (use fire), phase 2: knight"},
{id:"bb_106",text:"Enter the Research Hall — twisted hospital with patients on the ceiling"},
{id:"bb_107",text:"Find the Underground Corpse Pile lamp"},
{id:"bb_108",text:"Defeat Living Failures — group of failed Great One experiments, dodge their meteor shower"},
{id:"bb_109",text:"Defeat Lady Maria of the Astral Clocktower — three phases: sword → fire → blood; one of the best boss fights in FromSoft history"},
{id:"bb_110",text:"Receive the Astral Clocktower Key — opens the way to Fishing Hamlet"},
{id:"bb_111",text:"Light Fishing Hamlet lamp"},
{id:"bb_112",text:"Find Valtr, Master of the League — gives the Impurity rune for the League covenant"},
{id:"bb_113",text:"Optional: find the Rakuyo weapon — kill two giant sharks in the well (both must die quickly)"},
{id:"bb_114",text:"Defeat Orphan of Kos — hatches from the beached Kos corpse, two phases; one of the hardest bosses in the game"},
{id:"bb_115",text:"After Orphan: find Simon dying nearby — he gives you the Bowblade and a Blood Gem"},
]},
{id:"bb_chalices",title:"Chalice Dungeons",type:"optional",items:[
{id:"bb_116",text:"Pthumeru Chalice (starter) — procedurally generated, learn the layout"},
{id:"bb_117",text:"Central Pthumeru Chalice — fixed layout, drops Radial Bloodstone Chunks"},
{id:"bb_118",text:"Lower Pthumeru Chalice — harder version"},
{id:"bb_119",text:"Ailing Loran Chalice (from Nightmare Frontier) — fire and arcane gems"},
{id:"bb_120",text:"Hintertomb Chalice — optional branch, poison gems"},
{id:"bb_121",text:"Defiled Chalice (Cursed Pthumeru) — your max HP is permanently halved; hardest dungeon"},
{id:"bb_122",text:"Defiled bosses: Watchdog of the Old Lords and Defiled Amygdala (with half HP — brutal)"},
{id:"bb_123",text:"Great Pthumeru Ihyll Chalice — leads to the final chalice boss"},
{id:"bb_124",text:"Defeat Yharnam, Pthumerian Queen — final chalice dungeon boss, dodge her blood attacks"},
{id:"bb_125",text:"Blood Rock: found in deepest chalice dungeons — upgrades weapons to +10 (max)"},
]},
{id:"bb_upgrades",title:"Upgrades & Collectibles",type:"missable",items:[
{id:"bb_126",text:"Weapon upgrade path: +1→+3 (Bloodstone Shards) → +4→+6 (Twin Bloodstone Shards) → +7→+9 (Bloodstone Chunks) → +10 (Blood Rock)"},
{id:"bb_127",text:"Bloodstone Chunks: farmable from Snake Ball enemies in Mergo's Loft Middle — stock up before going to +9"},
{id:"bb_128",text:"Blood Rock: one guaranteed in Mergo's Loft, one from Pthumeru Ihyll chalice, rare drop from Winter Lanterns"},
{id:"bb_129",text:"Caryll Runes: found throughout the world — equip via the Rune Workshop Tool (from Hemwick)"},
{id:"bb_130",text:"Hunter Tools (arcane weapons): Augur of Ebrietas, A Call Beyond, Choir Bell, Executioner's Gloves — buy from Bath Messengers after finding the right badges"},
{id:"bb_131",text:"Insight shop: spend 10 Insight to buy unique items from the Bath Messengers in Hunter's Dream"},
]},
]},
{id:"sekiro",label:"Sekiro",shortLabel:"Sekiro",accent:"#c0c8a8",bg:"#080a08",sections:[
{id:"sek_prologue",title:"Prologue & Dilapidated Temple",type:"main",items:[
{id:"sek_001",text:"Wake up as Wolf — tutorial on Deflect and Deathblow mechanics"},
{id:"sek_002",text:"Rescue the Divine Heir Kuro — but Genichiro cuts off your arm and takes him"},
{id:"sek_003",text:"Wake up in the sculptor's hut — the Sculptor has attached the Shinobi Prosthetic arm"},
{id:"sek_004",text:"Talk to the Sculptor — he explains Resurrection and the cost of using it (Dragon Rot)"},
{id:"sek_005",text:"Pick up the Kusabimaru katana from the shrine"},
{id:"sek_006",text:"Light the Dilapidated Temple idol — your main hub for the whole game"},
{id:"sek_007",text:"Find Hanbei the Undying near the temple — unlimited combat practice, he cannot die"},
{id:"sek_008",text:"Give sake to the Sculptor for lore about his past (Unrefined Sake, Dragonspring Sake)"},
]},
{id:"sek_outskirts",title:"Ashina Outskirts",type:"main",requires:["sek_prologue"],items:[
{id:"sek_009",text:"Light Ashina Outskirts – Gate Path idol"},
{id:"sek_010",text:"Use stealth to thin out enemy patrols — Shinobi Deathblow from above or behind"},
{id:"sek_011",text:"Defeat General Naomori Kawarada (mini-boss) — practice Mikiri Counter on his thrust attacks"},
{id:"sek_012",text:"Light Outskirts Wall – Gate Path idol"},
{id:"sek_013",text:"Defeat Chained Ogre — grab-heavy enemy; set him on fire with the Flame Vent prosthetic tool"},
{id:"sek_014",text:"Find the Flame Vent prosthetic tool in the area near the Chained Ogre"},
{id:"sek_015",text:"Light Outskirts Wall – Stairway idol"},
{id:"sek_016",text:"Defeat General Tenzen Yamauchi (mini-boss)"},
{id:"sek_017",text:"Talk to the old woman near Gyoubu's arena after clearing the area — she gives the Young Lord's Bell Charm"},
{id:"sek_018",text:"Defeat Gyoubu Masataka Oniwa — mounted cavalry boss; grapple to him to close distance"},
{id:"sek_019",text:"Receive the Mechanical Barrel — bring to the Sculptor for a new prosthetic slot"},
]},
{id:"sek_hirata",title:"Hirata Estate (Past Memory)",type:"optional",requires:["sek_outskirts"],items:[
{id:"sek_020",text:"Offer the Young Lord's Bell Charm at the Buddha statue in the Dilapidated Temple — enter the memory"},
{id:"sek_021",text:"Light Estate Path idol"},
{id:"sek_022",text:"Defeat Shinobi Hunter Enshin of Misen (mini-boss) — sweep-heavy, jump to avoid sweeps"},
{id:"sek_023",text:"Defeat Juzou the Drunkard — use the NPC summon to distract him, kill his men first while he drinks"},
{id:"sek_024",text:"Light Hirata Estate – Main Hall idol"},
{id:"sek_025",text:"Defeat Lady Butterfly — two phases: acrobatic melee → needle throws and phantom summons"},
{id:"sek_026",text:"Receive the Sakura Droplet — increases your Resurrection use count permanently"},
{id:"sek_027",text:"Second visit (Purification ending only): offer the Father's Bell Charm — a harder version of the estate with Owl as the boss"},
]},
{id:"sek_castle",title:"Ashina Castle",type:"main",requires:["sek_outskirts"],items:[
{id:"sek_028",text:"Light Ashina Castle idol"},
{id:"sek_029",text:"Eavesdrop on Genichiro and his general through the sliding door"},
{id:"sek_030",text:"Find Kuro's room — talk to him to learn about the Dragon's Heritage and the Immortal Severance ritual"},
{id:"sek_031",text:"Talk to Emma the physician — she treats Kuro and is key to multiple endings"},
{id:"sek_032",text:"Find the Shuriken Wheel prosthetic tool near the castle water wheel"},
{id:"sek_033",text:"Defeat Blazing Bull (mini-boss) — use Flame Vent to panic it, stay behind it"},
{id:"sek_034",text:"Light Upper Tower – Antechamber idol"},
{id:"sek_035",text:"Defeat General Kuranosuke Matsumoto (mini-boss)"},
{id:"sek_036",text:"Find Tengu of Ashina (actually Isshin in disguise) — he gives the Shinobi Esoteric Text if you kill 10 red-eyed enemies"},
{id:"sek_037",text:"Light Upper Tower – Kuro's Room idol"},
{id:"sek_038",text:"Light Ashina Castle Top idol"},
{id:"sek_039",text:"Defeat Seven Ashina Spears – Shikibu Toshikatsu Yamauchi on the rooftop (mini-boss)"},
{id:"sek_040",text:"Defeat Genichiro Ashina — three phases: bow → lightning (deflect it back) → Way of Tomoe"},
{id:"sek_041",text:"Receive the Black Mortal Blade — story item, cannot be used as a weapon yet"},
{id:"sek_042",text:"Return to Kuro — he tasks you with gathering the three ritual items"},
]},
{id:"sek_senpou",title:"Senpou Temple, Mt. Kongo",type:"main",requires:["sek_castle"],items:[
{id:"sek_043",text:"Enter Senpou Temple via the Abandoned Dungeon passage or high path from Ashina Outskirts"},
{id:"sek_044",text:"Light Senpou Temple, Mt. Kongo idol"},
{id:"sek_045",text:"Talk to the monks — they speak of the Immortal Severance ritual and their experiments"},
{id:"sek_046",text:"Defeat Long-arm Centipede Giraffe (mini-boss) — deflect all its rapid attacks relentlessly"},
{id:"sek_047",text:"Find the kite — use a Ceramic Shard to startle the kite-flying monk, grapple to the kite to cross the valley"},
{id:"sek_048",text:"Light Temple Grounds idol"},
{id:"sek_049",text:"Eavesdrop on the Head Priest at the inner sanctum — reveals the truth about Senpou's child experiments"},
{id:"sek_050",text:"Defeat Armored Warrior (mini-boss) — cannot be killed by damage; knock him off the bridge"},
